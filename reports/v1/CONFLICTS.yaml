version: 1
model: v1
phase: phase2-asset-audit
source:
  legacy_inventory: rule/_index.yaml
  legacy_tree: rule/
severity_definitions:
  blocking: cannot promote affected entry
  high: requires explicit mapping before promotion
  medium: needs evidence but does not block unrelated services
  info: observational
conflicts:
- id: AGG-001
  type: aggregate-vs-service
  severity: high
  scope: 14 legacy aggregate entries
  entries:
  - rule/UnionPay/UnionPay
  - rule/China/China
  - rule/Privacy/AdBlock
  - rule/AI/AI
  - rule/Developer/Developer
  - rule/Alibaba/Alibaba
  - rule/Apple/Apple
  - rule/Baidu/Baidu
  - rule/ByteDance/ByteDance
  - rule/Google/Google
  - rule/Microsoft/Microsoft
  - rule/JingDong/JingDong
  - rule/Restricted/Restricted
  - rule/Tencent/Tencent
  resolution: Do not automatically convert legacy aggregate into V1 parent-service. Classify as parent-service, category aggregate, or shared policy only after asset/hierarchy evidence.
- id: AGG-002
  type: category-name-collision
  severity: high
  entries:
  - rule/AI/AI
  - rule/China/China
  - rule/Developer/Developer
  - rule/Restricted/Restricted
  resolution: V1 Category IDs are classification entities; same-named legacy rule entries must remain separate until explicit entity mapping is established.
- id: GOOGLE-001
  type: metadata-child-drift
  severity: high
  entries:
  - rule/Google/Google
  details: Historical Google metadata referenced children including googledrive and gcp, while the current rule tree/index inventory exposes Firebase, GoogleFCM, YouTube and YouTubeMusic as concrete Google entries.
  resolution: Do not create missing children from metadata alone. Quarantine metadata-only references until current assets are located and audited.
- id: GOOGLE-002
  type: provisional-hierarchy
  severity: medium
  entries:
  - rule/Google/GoogleFCM
  resolution: Keep google/google-fcm provisional until its role and independent-service semantics are confirmed.
- id: V1-001
  type: seed-without-legacy-evidence
  severity: high
  entries:
  - rule/service/google/gemini/service.yaml
  - rule/service/google/gmail/service.yaml
  details: The V1 seed contains google/gemini and google/gmail, but the current legacy rule inventory contains AI/Gemini and no Google/Gmail entry.
  resolution: Do not treat seed files as proof of legacy coverage. Map AI/Gemini separately and require evidence before introducing google/gemini or google/gmail as promoted canonical entities.
- id: DUP-001
  type: semantic-overlap-not-dedup
  severity: medium
  entries:
  - rule/AI/Anthropic
  - rule/AI/Claude
  - rule/AI/Copilot
  - rule/Microsoft/Microsoft
  resolution: Potential vendor/product relationships must not be collapsed by name similarity. Only canonical asset equality can drive deduplication.
- id: NET-001
  type: network-vs-service
  severity: high
  entries:
  - rule/ChinaMobile/ChinaMobile
  - rule/ChinaTelecom/ChinaTelecom
  - rule/ChinaUnicom/ChinaUnicom
  - rule/Developer/Cloudflare
  - rule/Amazon/AWS
  resolution: Network/provider infrastructure rules must not be reassigned to commercial SaaS/product services without explicit asset semantics. Network Dataset remains separate.
- id: COVER-001
  type: client-coverage-unknown
  severity: medium
  entries:
  - all 184 legacy rule entries
  resolution: This audit establishes legacy inventory and asset counts from rule/_index.yaml; it does not claim per-client generated coverage. V3 adapter/golden audit must establish client-level coverage separately.
- id: PATH-001
  type: legacy-path-vs-canonical-path
  severity: medium
  entries:
  - all 184 legacy rule entries
  resolution: Legacy paths are evidence pointers only. Canonical V1 IDs must be stable lowercase ASCII and may use hierarchy; do not derive canonical IDs mechanically from display names.
unmapped_aggregate_candidates:
- unionpay
- china
- adblock
- ai
- developer
- alibaba
- apple
- baidu
- bytedance
- microsoft
- jingdong
- restricted
- tencent
status: open-for-phase2-resolution
