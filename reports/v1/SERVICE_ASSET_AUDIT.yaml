aggregate_asset_rule:
  statement: Aggregate assets cannot be reconstructed as a pure union of indexed children.
  evidence:
    - AI aggregate list contains assets for services not present as indexed AI children, including Mistral-related and other AI service domains.
    - Google aggregate contains Google-wide assets spanning multiple products and infrastructure layers.
    - Alibaba aggregate contains broad ecosystem assets beyond the seven indexed child services.
  v1_implication: Parent own assets must remain first-class Canonical Assets; child relations are hierarchy metadata, not the sole asset source.

url_audit:
  status: unresolved
  finding: Legacy inventory distinguishes domain and IP/CIDR counts but has no dedicated URL count. Mixed/domain lists are rule-format outputs, not sufficient evidence for a canonical URL field.
  action: Extract URL-shaped entries only during canonical asset normalization; do not infer URLs from README links or generated CDN links.

