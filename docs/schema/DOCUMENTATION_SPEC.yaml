# Documentation Layer v1.0 contract — frozen for generators and validators.
documentation_contract_version: "1.0"
updated: "2026-10-02"

depends:
  ir_schema: semantic_ir_v2
  icon_system: v6
  layout_schema: directory_layout_v2

principles:
  - semantic_ir_derived_chain_is_source_of_truth
  - docs_are_regenerable
  - machine_sections_separated_from_overrides
  - raw_urls_only_from_generated_manifest
  - icons_only_from_icon_v6_dist

inputs:
  - rule/_index.yaml
  - generated/manifest.json
  - config/icon_v6.yaml
  - config/icon_docs.yaml
  - Icon dist production manifest (via icon_v6.release_id)
  - docs/overrides/{service_id}.md (optional)

outputs:
  - docs/generated/docs-index.json
  - docs/rules/{service_id}.md
  - docs/services/**/README.md (generated sections)
  - docs/SERVICE_CATALOG.generated.md

required_fields_per_service:
  - service_id
  - display_name
  - provider
  - entity
  - path
  - rule_count
  - sha256
  - run_id
  - ir_digest
  - clients
  - raw
  - icon

optional_fields:
  - category
  - source_link

icon_defaults:
  style: source_original
  size: 256
  format: png

clients:
  - egern
  - loon
  - mihomo
  - quantumultx
  - shadowrocket
  - singbox
  - surge

forbidden_in_consumer_docs:
  - assets/icons/v3
  - assets/icons/v4
  - assets/icons/v5
  - Icon Library V4

notes:
  - Category is optional; missing must not fail coverage.
  - provider_aggregate without icon id may use base id or representative map.
  - rule/ is browse-only; clients consume generated/ only.

# v1.1 notes (2026-10-02)
# - Raw matching is extension-agnostic (yaml/list/json) under directory_layout_v2
# - Service pages include rule↔generated path binding and singbox rule_count caveat
# - Do NOT require per-file README under rule/** or generated/** client trees
# - Human narrative remains docs/overrides only; rule/ and generated/ stay production artifacts

# ---------------------------------------------------------------------------
# Path Links G3 (2026-10-02) — quick pointers under rule/ and generated/
# ---------------------------------------------------------------------------
path_links:
  version: "1.0"
  strategy: G3
  filename: README.md
  markers:
    start: "<!-- PATH_LINKS_GENERATED_START -->"
    end: "<!-- PATH_LINKS_GENERATED_END -->"
  rule_tree:
    enabled: true
    # One README.md beside each _index entry file (same directory as *.yaml)
  generated_tree:
    enabled: true
    # One short README.md beside each client_rules file (all 7 clients)
  principles:
    - pointers_only_no_second_doc_ssot
    - raw_urls_only_from_manifest
    - fully_regenerable
    - do_not_hand_edit
  docs_url_templates:
    rules: "https://github.com/cn-wanmei/Popular-Rules-Collection/blob/main/docs/rules/{service_id}.md"
    services: "https://github.com/cn-wanmei/Popular-Rules-Collection/blob/main/docs/services/{provider}/{service_dir}/README.md"
  raw_url_template: "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/generated/{file}"

# directory_contract allows nested rule/**/README.md for Path Links G3

# Pipeline: Collect → Build → Publish (lands rule/generated) → Documentation Layer
