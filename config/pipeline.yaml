version: 3
updated: "2026-09-01"
publish_concurrency_group: main-publish
engine:
  entry: python -m src.engine.cli all
  workspace: data/
  public_projection: generated/
  runtime_v2_dependency: 0
  semantic_ir: semantic_ir_v2
  execution: dag-ready
  content_addressable_snapshots: true

stages:
  naming_gate:
    command: python -m src.engine.cli naming_gate
    required: true
  collect:
    script: scripts/collect.py
    required: true
    note: "Upstream transport only; no normalization or build responsibility."
  engine:
    command: python -m src.engine.cli all --sources backup/<date> --data data
    required: true
  validate:
    engine_gates:
      - golden
      - release
      - seven_clients
      - reproducibility
      - observability
      - quality_policy
    required: true
  size_gate:
    script: scripts/size_gate.py
    required: true
  publish:
    command: python -m src.engine.cli promote --run-id <run_id> --baseline data/baseline/canonical.json
    required: true

p1_5:
  observability:
    metrics: data/runs/<run_id>/metrics/metrics.json
    source_health: data/runs/<run_id>/metrics/source-health.json
    parser_coverage: data/runs/<run_id>/metrics/parser-coverage.json
    quality: data/runs/<run_id>/quality.json

p2:
  semantic_ir: semantic_ir_v2
  adapters: parallel

p2_5:
  cas_root: data/cas/objects
  snapshot_manifest_references: true
  cache_ready: true

p3:
  dag_executor: src/engine/dag/executor.py
  incremental_ready: true
  retention_plan: data/runs/<run_id>/retention-plan.json
  sbom: data/runs/<run_id>/release/sbom.json

legacy_2x:
  production: false
  normalization: removed_from_pipeline
  database_services_runtime: false
  build_shims: deprecated
  validators: non_production_only
