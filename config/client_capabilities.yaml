datasets:
  service_rules:
    note: "per-service domain rules"
    data_paths: ["database/services", "database/domains"]
    capability_key: domain
    sample_services: ["google", "apple", "tencent", "openai"]

  service_ip:
    note: "per-service IP sidecars (verified service-owned only)"
    data_paths: ["database/ips"]
    capability_key: ip_cidr
    sample_services: ["china", "chinaunicom"]

  lan:
    data_paths: ["database/network"]
    capability_key: lan
    network_key: lan

  geosite_policy:
    note: "derived direct/proxy policy lists — NOT full geosite catalog"
    data_paths: ["database/geosite"]
    capability_key: geosite_list
    network_key: geosite_policy

  geoip_country:
    data_paths: ["database/geoip"]
    capability_key: geoip_list
    network_key: geoip_country

  geoip_mmdb:
    note: "published artifact; source fetch lands in generated/mmdb"
    data_paths: ["generated/mmdb"]
    capability_key: geoip_mmdb
    network_key: geoip_mmdb

  provider:
    note: "Provider ≠ Service — never map AWS ranges to Amazon retail"
    data_paths: ["database/provider"]
    capability_key: provider_cidr
    network_key: provider

  asn_metadata:
    note: "metadata only — not routable CIDR rules"
    data_paths: ["database/asn"]
    capability_key: asn_meta
    network_key: null

  policy:
    data_paths: ["database/policies"]
    capability_key: policy_manifest
    network_key: null
