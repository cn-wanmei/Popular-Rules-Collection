version: 3
schema: icon_system_v3_config
renderer_version: 3.0.0
source_manifest: assets/icons/manifest.yaml
identity:
  source_of_truth: service_catalog
  binding_field: service_id
  variant_key: style
  roles: [service, strategy, client_policy, provider, category, country, region, special]
styles:
  - {id: official, name: Official}
  - {id: gradient, name: Gradient}
  - {id: liquid_glass, name: Liquid Glass}
  - {id: soft_3d, name: Soft 3D}
  - {id: minimal, name: Minimal}
  - {id: dark_neon, name: Dark / Neon}
  - {id: monochrome, name: Monochrome / Duotone}
clients:
  mihomo: {preferred_style: minimal, preferred_format: png, preferred_size: 128, supports_svg: true, supports_png: true}
  singbox: {preferred_style: minimal, preferred_format: png, preferred_size: 128, supports_svg: true, supports_png: true}
  surge: {preferred_style: minimal, preferred_format: png, preferred_size: 256, supports_svg: false, supports_png: true}
  shadowrocket: {preferred_style: minimal, preferred_format: png, preferred_size: 256, supports_svg: false, supports_png: true}
  quantumultx: {preferred_style: minimal, preferred_format: png, preferred_size: 256, supports_svg: false, supports_png: true}
  egern: {preferred_style: gradient, preferred_format: png, preferred_size: 256, supports_svg: true, supports_png: true}
  loon: {preferred_style: minimal, preferred_format: png, preferred_size: 256, supports_svg: false, supports_png: true}
scoring:
  officialness: 30
  visual_quality: 20
  stability: 15
  cross_platform_reuse: 15
  popularity: 10
  freshness: 5
  file_efficiency: 5
protected_brands: [apple, google, microsoft, amazon, aws, openai, anthropic, netflix, telegram, github, alibaba, alipay, taobao, tmall, jd, wechat, whatsapp, facebook, instagram, paypal, stripe]
source_overrides:
  "1688":
    name: 1688
    icon_key: "1688"
    status: verified
    source:
      provider: see-yue-theme
      provenance: third_party
      verified: true
      type: see-yue-theme
      url: https://github.com/jinghu-moon/typora-see-yue-theme/blob/fe68d70b682eb0c71d3f269cf43f407bfac64247/SeeYue/Images/Favicon/01-Lives-Websites/1.1-Shopping/1688.svg
      commit: fe68d70b682eb0c71d3f269cf43f407bfac64247
    files:
      svg: source/1688.svg
    license:
      type: Apache-2.0
      reviewed: true
      note: Source repository declares Apache-2.0; trademark rights remain with 1688.
  cainiao:
    name: Cainiao
    icon_key: cainiao
    status: verified
    source:
      provider: custom-brand-icons
      provenance: third_party
      verified: true
      type: custom-brand-icons
      url: https://github.com/elax46/custom-brand-icons/blob/27f9ad7244b31db2bd4d273e1d328ffd7aba1539/icon-svg/cainiao.svg
      commit: 27f9ad7244b31db2bd4d273e1d328ffd7aba1539
    files:
      svg: source/cainiao.svg
    license:
      type: MIT
      reviewed: true
      note: Repository is MIT; brand/trademark rights remain with Cainiao.
  dingding:
    name: DingTalk
    icon_key: dingding
    status: verified
    source:
      provider: ant-design-icons
      provenance: third_party
      verified: true
      type: ant-design-icons
      url: https://github.com/ant-design/ant-design-icons/blob/7f2516ac91226d2b41f93b35cb5197c8d94f7189/packages/icons-react/src/icons/DingtalkOutlined.tsx
      commit: 7f2516ac91226d2b41f93b35cb5197c8d94f7189
    files:
      svg: source/dingding.svg
    license:
      type: MIT
      reviewed: true
      note: Embedded DingTalk mark sourced from MIT-licensed Ant Design Icons; trademark rights remain with DingTalk.
  qqmail:
    name: QQ Mail
    icon_key: qqmail
    status: verified
    source:
      provider: td-design
      provenance: third_party
      verified: true
      type: td-design
      url: https://github.com/thundersdata-frontend/td-design/blob/f803d835ae93ecfda0f824e7c8090402a5b0fd6b/packages/react-native-share/src/svg/qqmail.tsx
      commit: f803d835ae93ecfda0f824e7c8090402a5b0fd6b
    files:
      svg: source/qqmail.svg
    license:
      type: Apache-2.0
      reviewed: true
      note: Extracted from the Apache-2.0 licensed td-design source file; trademark rights remain with Tencent/QQ Mail.
  qqmusic:
    name: QQ Music
    icon_key: qqmusic
    status: verified
    source:
      provider: arcticons
      provenance: third_party
      verified: true
      type: arcticons
      url: https://github.com/Arcticons-Team/Arcticons/blob/15.3.2/icons/black/qq_music.svg
      commit: 15.3.2
    files:
      svg: source/qqmusic.svg
    license:
      type: CC-BY-SA-4.0
      reviewed: true
      note: Arcticons icon asset; attribution and share-alike obligations apply.
  taobao:
    name: Taobao
    icon_key: taobao
    status: verified
    source:
      provider: simple-icons
      provenance: third_party
      verified: true
      type: simple-icons
      url: https://github.com/simple-icons/simple-icons/blob/b86d5c9a0bdd4f3f5c30898a63654dd32f39fd76/icons/taobao.svg
      commit: b86d5c9a0bdd4f3f5c30898a63654dd32f39fd76
    files:
      svg: source/taobao.svg
    license:
      type: CC0-1.0
      reviewed: true
      note: Pinned Simple Icons asset; trademark rights remain with the respective owner.
future_source_reconciliation:
  tencentcloud:
    state: pending
    service_state: verified
    enabled: false
    official_reference: https://cloud.tencent.com/act/event/icons
    source_policy: official_source_asset_required
    license_status: pending
    cutover_blocker: immutable_official_asset_and_license_reverification
  tmall:
    state: pending
    service_state: verified
    enabled: false
    official_reference: https://www.tmall.com/
    source_policy: official_source_asset_required
    license_status: pending
    cutover_blocker: immutable_official_asset_and_lineage_reverification
official_source_policy:
  domain_registry: config/official_sites.yaml
  unknown_license_default_release: false
  protected_brand_requires_review: true
upstream_sources:
  - {id: simple-icons, role: brand_candidate, trust: A, homepage: https://github.com/simple-icons/simple-icons}
  - {id: iconify-icon-sets, role: brand_and_semantic_candidate, trust: A, homepage: https://github.com/iconify/icon-sets}
  - {id: lige_icon, role: brand_candidate, trust: B, homepage: https://github.com/lige47/lige_icon}
  - {id: oasisic, role: client_and_policy_candidate, trust: B, homepage: https://github.com/Hawaiine/Oasisic-Icons}
  - {id: datatrans-payment-logos, role: payment_candidate, trust: A, homepage: https://github.com/datatrans/payment-logos}
  - {id: official-brand-site, role: official_reference, trust: S, homepage: null}
semantic_sets:
  strategy: {direct: Direct, proxy: Proxy, reject: Reject, auto: Auto, fallback: Fallback, urltest: URL Test, loadbalance: Load Balance, final: Final, match: Match, dns: DNS, global: Global, select: Select, private: Private, lan: LAN, china: China, network: Network}
  client_policy: {mihomo: MH, singbox: SB, surge: SG, shadowrocket: SR, quantumultx: QX, egern: EG, loon: LN}
release:
  stable_root: assets/icons/v3/releases
  latest_root: assets/icons/v3/releases/latest
  previous_good_required: true
quality:
  required_styles: [official, gradient, liquid_glass, soft_3d, minimal, dark_neon, monochrome]
  raster_sizes: [24, 32, 48, 64, 128, 256]
