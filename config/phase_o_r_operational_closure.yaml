version: 1
schema: phase_o_r_operational_closure_v1
purpose: "Close the operational evidence gap between Phase N/O merged code and real runtime state."
current_state_file: reports/v1/PHASE_O_STATE.json
evidence_bundle: reports/v1/PHASE_O_EVIDENCE_BUNDLE.json

states:
  - NOT_EXECUTED
  - CUTOVER_EXECUTED
  - OBSERVING
  - FROZEN_OLD_ROOT
  - RETIRED

transition_policy:
  NOT_EXECUTED:
    next: [CUTOVER_EXECUTED]
    requires:
      - cutover.status=EXECUTED
      - cutover.commit_sha
      - cutover.loader_root=rules
      - cutover.ci_root=rules
      - cutover.old_root_preserved=true
  CUTOVER_EXECUTED:
    next: [OBSERVING]
    requires:
      - observation_runs >= 3
      - every observation run is post_cutover
      - every observation run passes all required checks
  OBSERVING:
    next: [FROZEN_OLD_ROOT]
    requires:
      - observation_runs >= 3
      - every observation run is post_cutover
      - every observation run passes all required checks
  FROZEN_OLD_ROOT:
    next: [RETIRED]
    requires:
      - observation_runs >= 3
      - old_root_freeze.status=FROZEN
      - old_root_freeze.evidence
      - operator_approval=true

observation:
  minimum_runs: 3
  required_checks:
    - seven_client
    - golden
    - determinism
    - artifact_equivalence
    - semantic_regression
    - source_health
  require_distinct_run_ids: true
  require_distinct_snapshot_ids: true
  require_post_cutover_only: true

retirement:
  explicit_operator_approval_required: true
  automatic_delete: false
  old_root_must_be_absent_only_after_frozen_old_root: true
  deletion_is_out_of_scope_for_o_r: true

anti_forgery:
  runs_argument_is_forbidden: true
  check_values_must_be_evidence_derived: true
  cutover_must_be_persisted: true
  state_must_be_persisted: true
  evidence_bundle_must_be_persisted: true
