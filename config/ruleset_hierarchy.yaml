# Provider → Aggregate → Service hierarchy.
# Provider ownership and cross-provider categories are distinct concepts.
version: 1
schema: provider_service_hierarchy_v1
rules:
  aggregate_is_explicit: true
  service_is_sibling_of_aggregate: true
  no_name_prefix_inference: true
  aggregate_semantics: union_of_declared_children_plus_provider_direct
  category_semantics: union_of_declared_members_plus_category_direct
