version: 2
schema: rule_distribution_policy_v2
updated: "2026-09-22"
root: rule

# V3 distribution contract. Canonical truth is materialized per run under
# data/runs/<run-id>/canonical and Semantic IR under data/runs/<run-id>/ir.
# Provider/China semantics below remain the existing production hierarchy.
# The human rule tree and generated client trees are sibling projections of one Run.
layout:
  human_root: "rule"
  human_aggregate: "rule/{provider}/all/rules.yaml"
  human_service: "rule/{provider}/{service}/rules.yaml"
  human_china: "rule/china/all/rules.yaml"
  human_category: "rule/category/{category}/all/rules.yaml"
  human_group: "rule/group/{group}/rules.yaml"
  human_aggregate_entity: "rule/aggregate/{aggregate}/rules.yaml"
  human_unmapped_service: "rule/unmapped/{service}/rules.yaml"
  generated_client_root: "generated/{client}"
  generated_aggregate: "generated/{client}/{provider}/all"
  generated_service: "generated/{client}/{provider}/{service}"
  generated_china: "generated/{client}/china/all"

semantics:
  provider_aggregate: "union_of_provider_direct_rules_and_all_declared_services"
  service: "service_only_canonical_membership"
  human_browse_output: true
  generated_output: true
  source_of_truth: "data/runs/<run-id>/canonical"
  semantic_intermediate: "data/runs/<run-id>/ir"
  same_run_required: true
  rule_is_not_runtime_input: true
  generated_is_not_canonical_input: true
  no_alternate_rule_root: true

# Providers with independent service directories are intentionally NOT folded
# into the China aggregate. Their own aggregate/service trees are authoritative.
china:
  id: china
  display_name: China
  kind: domestic_aggregate
  include: domestic_rule_universe
  exclude_independent_providers:
    - alibaba
    - tencent
    - baidu
    - jd
    - meituan
    - bytedance
    - netease
    - huawei
    - xiaomi
    - oppo
    - vivo
  require_domain_and_ip_coverage: true
  note: "China/all represents the complete China rule universe except providers explicitly separated into independent service trees."

providers:
  # Provider aggregates include every declared service under the provider.
  apple:
    aggregate_path: rule/apple/all
    services_from: service_model
  google:
    aggregate_path: rule/google/all
    services_from: service_model
  microsoft:
    aggregate_path: rule/microsoft/all
    services_from: service_model
  amazon:
    aggregate_path: rule/amazon/all
    services_from: service_model
  tencent:
    aggregate_path: rule/tencent/all
    services_from: service_model
  alibaba:
    aggregate_path: rule/alibaba/all
    services_from: service_model
  baidu:
    aggregate_path: rule/baidu/all
    services_from: service_model
  bytedance:
    aggregate_path: rule/bytedance/all
    services_from: service_model
  netease:
    aggregate_path: rule/netease/all
    services_from: service_model
  huawei:
    aggregate_path: rule/huawei/all
    services_from: service_model
  xiaomi:
    aggregate_path: rule/xiaomi/all
    services_from: service_model
  atlassian:
    aggregate_path: rule/atlassian/all
    services_from: service_model
  meta:
    aggregate_path: rule/meta/all
    services_from: service_model
  cloudflare:
    aggregate_path: rule/cloudflare/all
    services_from: service_model
  adobe:
    aggregate_path: rule/adobe/all
    services_from: service_model
  hoyoverse:
    aggregate_path: rule/hoyoverse/all
    services_from: service_model

invariants:
  - provider_semantics_are_preserved
  - china_semantics_are_preserved
  - rule_files_are_derived_from_semantic_ir
  - rule_and_generated_share_the_same_run_id_and_ir_digest
  - rule_has_no_client_specific_syntax
  - generated_paths_never_read_rule
  - rule_never_reads_generated
  - rules_directory_must_not_exist
  - no_legacy_rule_tree_layouts
