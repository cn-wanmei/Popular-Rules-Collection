version: 2
schema: rule_distribution_policy_v2
updated: "2026-09-22"
root: rule

layout:
  human_root: rule
  human_aggregate: "rule/{provider}/all/rules.yaml"
  human_service: "rule/{provider}/{service}/rules.yaml"
  human_china: "rule/china/all/rules.yaml"
  human_category: "rule/category/{category}/all/rules.yaml"
  human_group: "rule/group/{group}/rules.yaml"
  human_aggregate_entity: "rule/aggregate/{aggregate}/rules.yaml"
  human_unmapped_service: "rule/unmapped/{service}/rules.yaml"
  generated_client_root: "generated/{client}"
  generated_aggregate: "generated/{client}/{provider}/all"
  generated_service: "generated/{client}/{provider}/{service}"
  generated_china: "generated/{client}/china/all"

semantics:
  source_of_truth: "data/runs/<run-id>/canonical"
  semantic_intermediate: "data/runs/<run-id>/ir"
  human_browse_output: true
  generated_output: true
  same_run_required: true
  rule_is_not_runtime_input: true
  generated_is_not_canonical_input: true
  no_alternate_rule_root: true

invariants:
  - rule_files_are_derived_from_semantic_ir
  - rule_and_generated_share_the_same_run_id_and_ir_digest
  - rule_has_no_client_specific_syntax
  - generated_paths_never_read_rule
  - rule_never_reads_generated
  - rules_directory_must_not_exist
  - no_legacy_rule_tree_layouts
