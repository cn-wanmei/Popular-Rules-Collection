version: 1
schema: rule_directory_policy_v1
updated: "2026-09-17"
root: rules

# Canonical source layout. Each directory contains exactly one logical ruleset source.
# Provider aggregates are complete unions of their declared provider services.
# China is a special domestic aggregate: it covers the China rule universe, but
# explicitly excludes providers that have their own independent service trees.
layout:
  provider_root: "rules/{provider}"
  aggregate: "rules/{provider}/all"
  service: "rules/{provider}/{service}"
  china_aggregate: "rules/china/all"
  rule_file: "rules/{scope}/rules.yaml"
  generated_client_root: "generated/{client}"
  generated_aggregate: "generated/{client}/{provider}/all"
  generated_service: "generated/{client}/{provider}/{service}"
  generated_china: "generated/{client}/china/all"

semantics:
  provider_aggregate: "union_of_provider_direct_rules_and_all_declared_services"
  service: "service_only_canonical_membership"
  all_is_reference: true
  no_flattened_service_files: true
  generated_only: true

# Providers with independent service directories are intentionally NOT folded
# into the China aggregate. Their own aggregate/service trees are authoritative.
china:
  id: china
  display_name: China
  kind: domestic_aggregate
  include: domestic_rule_universe
  exclude_independent_providers:
    - alibaba
    - tencent
    - baidu
    - jd
    - meituan
    - bytedance
    - netease
    - huawei
    - xiaomi
    - oppo
    - vivo
  require_domain_and_ip_coverage: true
  note: "China/all represents the complete China rule universe except providers explicitly separated into independent service trees."

providers:
  # Provider aggregates include every declared service under the provider.
  apple:
    aggregate_path: rules/apple/all
    services_from: service_model
  google:
    aggregate_path: rules/google/all
    services_from: service_model
  microsoft:
    aggregate_path: rules/microsoft/all
    services_from: service_model
  amazon:
    aggregate_path: rules/amazon/all
    services_from: service_model
  tencent:
    aggregate_path: rules/tencent/all
    services_from: service_model
  alibaba:
    aggregate_path: rules/alibaba/all
    services_from: service_model
  baidu:
    aggregate_path: rules/baidu/all
    services_from: service_model
  bytedance:
    aggregate_path: rules/bytedance/all
    services_from: service_model
  netease:
    aggregate_path: rules/netease/all
    services_from: service_model
  huawei:
    aggregate_path: rules/huawei/all
    services_from: service_model
  xiaomi:
    aggregate_path: rules/xiaomi/all
    services_from: service_model
  atlassian:
    aggregate_path: rules/atlassian/all
    services_from: service_model
  meta:
    aggregate_path: rules/meta/all
    services_from: service_model
  cloudflare:
    aggregate_path: rules/cloudflare/all
    services_from: service_model
  adobe:
    aggregate_path: rules/adobe/all
    services_from: service_model
  hoyoverse:
    aggregate_path: rules/hoyoverse/all
    services_from: service_model

invariants:
  - provider_must_have_all_directory
  - every_public_service_must_have_directory
  - service_directory_must_not_contain_sibling_service_membership
  - aggregate_must_cover_all_declared_services
  - china_must_have_all_directory
  - china_must_cover_domain_and_ip_rule_types
  - china_must_not_include_excluded_independent_provider_services
  - generated_paths_must_mirror_canonical_directory_identity
  - no_rule_file_may_live_directly_under_provider_root
  - no_service_rule_file_may_live_at_rules_root
