version: 2
updated: "2026-09-17"
policy:
  git:
    max_file_mb: 5.0
    max_tracked_tree_mb: 90.0
    note: "Above max_file_mb SHOULD prefer release channel"
    note_size_gate: "size_gate.py reads max_tracked_tree_mb"
  release:
    max_bundle_mb: 200
  truth:
    layer: artifact_manifest
    note: "Release is distribution only; rules/ is canonical source"
release_globs:
  - "generated/mmdb/**"
  - "generated/routing/decisions.jsonl"
  - "generated/**/adblock*.list"
  - "generated/**/adblock*.yaml"
  - "generated/**/adblock*.json"
  - "generated/**/china.list"
  - "generated/**/adblock_domain.list"
  - "generated/**/adblock-pro_domain.list"
always_git:
  - "config/**"
  - "scripts/**"
  - "sources/**"
  - "rules/**"
  - "docs/**"
  - "reports/baseline/**"
  - "reports/artifact_manifest.json"
