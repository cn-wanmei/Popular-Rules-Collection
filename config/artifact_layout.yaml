version: 2
updated: "2026-11-07"
policy:
  git:
    max_file_mb: 100.0  # transitional until large IR leaves git (target 5.0)
    max_tracked_tree_mb: 4096.0  # active build tree: database + generated + reports
    max_backup_archive_mb: 16384.0  # archival snapshots; governed by retention and reference protection
    note: "Large individual files should prefer the release channel"
    note_size_gate: "size_gate.py: max_file_mb is per-file; max_tracked_tree_mb is active build tree; max_backup_archive_mb is historical backup storage"
    note_size_gate_build: "build.yml runs size_gate.py before staging a publish candidate"
  release:
    max_bundle_mb: 200
  truth:
    layer: artifact_manifest
    note: "Release is distribution; V3 runtime truth is data/runs/<run>; rule/ is legacy browse-only; generated/ is the published distribution layer"
release_globs:
  - "generated/mmdb/**"
  - "generated/network/**"
  - "generated/geosite/**"
  - "generated/geoip/**"
  - "generated/provider/**"
  - "generated/asn/**"
  - "generated/ip/**"
  - "generated/policies/**"
  - "generated/manifest.json"
  - "generated/network_manifest.json"
  - "generated/routing/decisions.jsonl"
  - "generated/**/adblock*.list"
  - "generated/**/adblock*.yaml"
  - "generated/**/adblock*.json"
  - "generated/**/china.list"
  - "generated/**/adblock_domain.list"
  - "generated/**/adblock-pro_domain.list"
always_git:
  - "config/**"
  - "scripts/**"
  - "sources/**"
  - "rules/**"
  - "docs/**"
  - "reports/baseline/**"
  - "reports/artifact_manifest.json"
