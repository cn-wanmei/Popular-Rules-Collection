# Builder registry — V3 Engine (src.engine) owns all builds.
# Canonical build entry: python -m src.engine.cli adapters
# Publish entry: python -m src.engine.cli promote
# Full production pipeline: python -m src.engine.cli all

version: 3
updated: "2026-09-08"
engine: "src.engine"
engine_entry: "python -m src.engine.cli all"

# Client identifiers are the adapter registry keys and generated/ directory names.
clients:
  mihomo:
    out_dir: generated/mihomo
    extensions: [".yaml"]
    engine_stage: adapters
  singbox:
    out_dir: generated/singbox
    extensions: [".json"]
    engine_stage: adapters
  surge:
    out_dir: generated/surge
    extensions: [".list"]
    engine_stage: adapters
  shadowrocket:
    out_dir: generated/shadowrocket
    extensions: [".list"]
    engine_stage: adapters
  quantumultx:
    out_dir: generated/quantumultx
    extensions: [".list"]
    engine_stage: adapters
  egern:
    out_dir: generated/egern
    extensions: [".yaml"]
    engine_stage: adapters
  loon:
    out_dir: generated/loon
    extensions: [".list"]
    engine_stage: adapters
