# Builder registry — V3 Engine (src.engine) 接管所有 build
# V2 build shims (scripts/build_*.py) 已废弃，保留仅供参考
#
# Build 入口: python -m src.engine.cli adapters
# Publish 入口: python -m src.engine.cli publish
# Full pipeline: python -m src.engine.cli all

version: 3
updated: "2026-09-01"
engine: "src.engine"
engine_entry: "python -m src.engine.cli all"

clients:
  mihomo:
    out_dir: generated/mihomo
    extensions: [".yaml", ".list"]
    engine_stage: adapters
  sing-box:
    out_dir: generated/sing-box
    extensions: [".json"]
    engine_stage: adapters
  surge:
    out_dir: generated/surge
    extensions: [".list"]
    engine_stage: adapters
  shadowrocket:
    out_dir: generated/shadowrocket
    extensions: [".list"]
    engine_stage: adapters
  quantumult-x:
    out_dir: generated/quantumult-x
    extensions: [".list"]
    engine_stage: adapters
  egern:
    out_dir: generated/egern
    extensions: [".yaml"]
    engine_stage: adapters
  loon:
    out_dir: generated/loon
    extensions: [".list"]
    engine_stage: adapters

deprecated_v2_builders:
  # Retained for reference only — do not invoke
  - scripts/build_mihomo.py
  - scripts/build_singbox.py
  - scripts/build_surge.py
  - scripts/build_shadowrocket.py
  - scripts/build_quantumultx.py
  - scripts/build_egern.py
  - scripts/build_loon.py
