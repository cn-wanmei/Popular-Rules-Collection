# Icon System 6.0 — Collection provider switch (R5 cutover)
schema: icon_system_v6_provider
version: "1.1.0"
updated: "2026-09-30"

# R5: default production provider is V6 (Popular-Rules-Icon freeze)
provider: v6

v5:
  base_path: assets/icons/v5
  registry: assets/icons/v5/registry.json

v6:
  repo: cn-wanmei/Popular-Rules-Icon
  branch: dist
  release_id: icon-2026.09.30.styles8
  path_template: "v/{variant_hash}{ext}"
  manifest_path: manifests/icon-2026.09.30.styles8.json
  mirrors:
    raw: "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/{path}"
    jsdelivr: "https://cdn.jsdelivr.net/gh/cn-wanmei/Popular-Rules-Icon@dist/{path}"
    fastly: "https://fastly.jsdelivr.net/gh/cn-wanmei/Popular-Rules-Icon@dist/{path}"
  # Safety: if V6 entry missing, fall back to V5 local assets
  fallback_to_v5: true
  # All frozen services are in scope (247); list omitted — resolver uses full manifest
  canary_services: []

rollback:
  provider: v5

notes: |
  R5 cutover 2026-09-30: provider=v6, release_id=icon-2026.09.30.styles8.
  Rollback: set provider=v5.
