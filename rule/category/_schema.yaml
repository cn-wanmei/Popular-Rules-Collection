version: 1
kind: category-schema

required:
  - id
  - name
  - kind
  - status

fields:
  id:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  name:
    type: string
  kind:
    const: category
  status:
    enum: [active, experimental, deprecated]

# Category membership is derived from service.categories.
# Do not maintain a second authoritative members list here.
