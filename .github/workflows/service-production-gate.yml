name: Service Production Hard Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - "config/p0_materialization.yaml"
      - "config/ruleset_hierarchy.yaml"
      - "config/service_primary.yaml"
      - "config/service_model/**"
      - "config/service_production_gate.yaml"
      - "scripts/service_production_gate.py"
      - "tests/engine/test_service_production_gate.py"
      - "requirements.lock"
  push:
    branches: [main, master]
    paths:
      - "config/p0_materialization.yaml"
      - "config/ruleset_hierarchy.yaml"
      - "config/service_primary.yaml"
      - "config/service_model/**"
      - "config/service_production_gate.yaml"
      - "scripts/service_production_gate.py"
      - "tests/engine/test_service_production_gate.py"
      - "requirements.lock"

jobs:
  service-production-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked deps
        run: python -m pip install -r requirements.lock
      - name: Service production gate tests
        run: PYTHONPATH=. python -m pytest tests/engine/test_service_production_gate.py -q
      - name: Service production hard gate
        run: PYTHONPATH=. python scripts/service_production_gate.py
