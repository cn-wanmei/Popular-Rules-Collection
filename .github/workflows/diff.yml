name: Diff Report

on:
  workflow_run:
    workflows: ["Normalize"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate diff report
        run: python scripts/diff_report.py
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No diff report changes; nothing to push."
            exit 0
          fi
          git commit -m "chore(diff): daily change report $(date -u +%Y-%m-%d)"
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "Diff workspace is dirty after commit; refusing rebase/push."
            git status --short
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --prune origin main
            if ! git rebase --autostash origin/main; then
              echo "Rebase failed because main contains a conflicting change. Aborting safely."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published diff report on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Push race detected; retrying (attempt ${attempt}/3)."
              sleep $((attempt * 5))
            fi
          done
          echo "Failed to publish diff report after 3 attempts."
          exit 1
