name: Phase 2 Service Identity Reconciliation Audit

on:
  pull_request:
    paths:
      - "config/p0_service_identity.yaml"
      - "config/service_model/**"
      - "rule/_index.yaml"
      - "scripts/phase2_service_identity_reconciliation.py"
      - ".github/workflows/phase2-identity-reconciliation.yml"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail unless evidence-bound Q-02 reconciliation is complete"
        required: false
        default: false
        type: boolean

jobs:
  identity-reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install pyyaml
      - name: Run non-mutating Q-02 reconciliation audit
        env:
          ENFORCE_INPUT: "${{ inputs.enforce }}"
        run: |
          args=(--output reports/phase2/service_identity_reconciliation.json)
          if [ "$ENFORCE_INPUT" = "true" ]; then
            args+=(--enforce)
          fi
          python scripts/phase2_service_identity_reconciliation.py "${args[@]}"
      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase2-service-identity-reconciliation
          path: reports/phase2/service_identity_reconciliation.json
          if-no-files-found: error
          retention-days: 30
