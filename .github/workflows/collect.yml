name: Collect Upstream

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      skip_large:
        description: "Skip mega service sets for a fast Engine run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach checkout to main
        run: |
          git fetch --prune origin main
          git switch -C main origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Naming gate (HARD)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Collection DAG
        id: collection
        run: |
          DAY=$(date -u +%Y-%m-%d)
          ARGS=(--data data --date "$DAY" --workers 12)
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            ARGS+=(--skip-large)
          fi
          set -o pipefail
          PYTHONPATH=. python -m src.engine.collection "${ARGS[@]}" 2>&1 | tee collection-run.log
          python3 <<'PY'
          import json
          from pathlib import Path
          text = Path('collection-run.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('collection JSON result not found')
          obj = json.loads(text[start:])
          if obj.get('status') == 'blocked':
              raise SystemExit(f"collection blocked: {obj.get('critical_failures')}")
          cid = obj.get('collection_id')
          root = obj.get('root')
          if not cid or not root:
              raise SystemExit('collection_id/root missing')
          Path('collection-id.txt').write_text(cid, encoding='utf-8')
          Path('collection-root.txt').write_text(root, encoding='utf-8')
          PY
          echo "collection_id=$(cat collection-id.txt)" >> "$GITHUB_OUTPUT"
          echo "collection_root=$(cat collection-root.txt)" >> "$GITHUB_OUTPUT"

      - name: Collection Manifest (HARD)
        run: |
          DAY=$(date -u +%Y-%m-%d)
          test -s "backup/${DAY}/manifests/_collection.json"
          PYTHONPATH=. python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          day = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          p = Path('backup') / day / 'manifests' / '_collection.json'
          obj = json.loads(p.read_text(encoding='utf-8'))
          assert obj['schema'] == 'collection_manifest_v1'
          assert obj['status'] in {'ok', 'degraded'}
          assert obj['root'] == f'backup/{day}'
          assert obj.get('manifest_sha256')
          print(f"collection_status={obj['status']} collection_id={obj['collection_id']}")
          PY

      - name: Engine — one immutable production DAG run
        id: engine
        run: |
          DAY=$(date -u +%Y-%m-%d)
          ENGINE_ARGS=()
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            ENGINE_ARGS+=(--skip-large)
          fi
          set -o pipefail
          PYTHONPATH=. python -m src.engine.cli all \
            --sources "backup/${DAY}" \
            --data data \
            "${ENGINE_ARGS[@]}" 2>&1 | tee engine-run.log
          python3 <<'PY'
          import json
          from pathlib import Path
          text = Path('engine-run.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('engine JSON result not found')
          obj = json.loads(text[start:])
          if obj.get('status') != 'ok':
              raise SystemExit(f"engine status={obj.get('status')} failures={obj.get('failure_stages')}")
          if not obj.get('collection_id'):
              raise SystemExit('engine did not bind collection_id')
          run_id = obj.get('run_id')
          if not run_id:
              raise SystemExit('engine run_id missing')
          Path('engine-run-id.txt').write_text(run_id, encoding='utf-8')
          PY
          echo "run_id=$(cat engine-run-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Legacy dataset diff report
        continue-on-error: true
        run: python scripts/dataset_diff.py

      - name: Dataset quality gate
        run: python scripts/dataset_quality.py

      - name: Coverage matrix (soft)
        continue-on-error: true
        run: python scripts/coverage_matrix.py

      - name: Hot missing audit (soft)
        continue-on-error: true
        run: python scripts/hot_missing_audit.py

      - name: Hierarchy validate (HARD)
        run: python scripts/hierarchy_validate.py

      - name: Hierarchy golden L4/L5 (HARD)
        run: python scripts/hierarchy_golden.py

      - name: Hierarchy coverage (soft)
        continue-on-error: true
        run: python scripts/hierarchy_coverage.py

      - name: Routing decision SSOT
        run: python scripts/routing_emit.py

      - name: Routing contract validate
        run: python scripts/routing_contract_validate.py

      - name: Conflict detector (soft)
        continue-on-error: true
        run: python scripts/conflict_detector.py

      - name: Provenance
        run: python scripts/provenance.py

      - name: Identity validate (soft)
        continue-on-error: true
        run: python scripts/identity_validate.py

      - name: Rule count drift (soft)
        continue-on-error: true
        run: python scripts/rule_count_drift.py

      - name: Quality validate (soft)
        continue-on-error: true
        run: python scripts/quality_validate.py

      - name: Cross-client semantic test (soft)
        continue-on-error: true
        run: python scripts/cross_client_semantic_test.py

      - name: Size gate (HARD)
        run: python scripts/size_gate.py

      - name: Generate docs (soft)
        continue-on-error: true
        run: python scripts/generate_docs.py

      - name: Generate rule pages (HARD)
        run: python scripts/generate_rule_pages.py --clean --strict

      - name: Generate links (soft)
        continue-on-error: true
        run: python scripts/generate_links.py

      - name: Icon build (soft)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 2>/dev/null || true
          pip install pillow cairosvg -q || true
          python scripts/icon_policy_set.py || true
          python scripts/icon_restore_si_identity.py || true
          python scripts/icon_no_black.py || true
          python scripts/build_icons.py --force || true
          python scripts/icon_engine.py --force || true
          python scripts/icon_contact_sheet.py || true
          python scripts/icon_dark_contrast_audit.py || true
          python scripts/icon_cleanup_dirs.py || true

      - name: Icon schema migrate (soft)
        continue-on-error: true
        run: python scripts/icon_schema_v2_migrate.py

      - name: Icon registry build (soft)
        continue-on-error: true
        run: python scripts/icon_registry_build.py

      - name: Icon config sync (soft)
        continue-on-error: true
        run: python scripts/icon_config_sync.py

      - name: Icon QA (hard gate)
        run: python scripts/icon_qa.py

      - name: Icon identity audit (soft)
        continue-on-error: true
        run: python scripts/icon_identity_audit.py

      - name: Icon coverage (soft)
        continue-on-error: true
        run: python scripts/icon_coverage.py

      - name: Publish V3 run (HARD)
        run: |
          RUN_ID=$(cat engine-run-id.txt)
          PYTHONPATH=. python -m src.engine.cli promote \
            --run-id "$RUN_ID" \
            --runs data/runs \
            --generated generated \
            --baseline data/baseline/canonical.json

      - name: Commit & push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          RUN_ID=$(cat engine-run-id.txt)

          DIFF_SUMMARY=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('data/runs') / '${RUN_ID}' / 'reports/diff/latest.json'
          if p.exists():
              d = json.loads(p.read_text())
              print(f\"+{d.get('added',0)}/-{d.get('removed',0)}/~{d.get('changed',0)} rules\")
          else:
              print('diff unavailable')
          " 2>/dev/null || echo "diff unavailable")

          git add -A \
            generated/ \
            rule/ \
            sources/health.yaml \
            reports/ \
            docs/ \
            assets/ \
            database/provenance/ \
            data/baseline/ \
            data/collection/ \
            data/runs/ \
            data/cas/ \
            backup/*/manifests/ \
            backup/${DAY}/sources/

          git status --porcelain
          if git diff --staged --quiet; then
            echo "No publish changes; nothing to push."
            exit 0
          fi

          git commit -m "chore(engine): collect+build ${DAY} | ${DIFF_SUMMARY}"

          # Never attempt a rebase with any local modifications or untracked temp files.
          rm -f collection-run.log engine-run.log collection-id.txt collection-root.txt engine-run-id.txt
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "Publish workspace is dirty after commit; refusing rebase/push."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            if ! git rebase --autostash origin/main; then
              echo "Rebase failed because main contains a conflicting change. Aborting safely."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published to main on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "Push race detected; refetching and retrying (attempt ${attempt}/5)."
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to publish after 5 attempts."
          exit 1
