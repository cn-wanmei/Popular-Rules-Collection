name: Collect Upstream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      skip_large:
        description: "Skip mega lists (adblock/china/proxy) for a fast run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Naming gate (HARD)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      # ── PHASE 1: Upstream collection ──────────────────────────────────
      - name: Validate source registry
        run: python scripts/validate_registry.py

      - name: Collect upstream rules
        run: python scripts/collect.py

      - name: Validate IP registry
        run: python scripts/validate_ip_registry.py

      - name: Collect IP rules
        run: python scripts/collect_ip.py

      - name: IP quality audit (soft)
        continue-on-error: true
        run: python scripts/ip_quality_audit.py

      - name: Validate dataset registry
        run: python scripts/validate_dataset_registry.py

      - name: Build network LAN datasets
        run: python scripts/build_network_lan.py

      - name: Collect datasets
        run: python scripts/collect_datasets.py

      - name: Build network datasets
        run: python scripts/build_network_datasets.py

      - name: Collect providers (soft)
        continue-on-error: true
        run: python scripts/collect_providers.py

      - name: Build provider datasets (soft)
        continue-on-error: true
        run: python scripts/build_provider_datasets.py

      # ── PHASE 2: V3 owns service-rule normalization + build ────────────
      - name: Engine — one immutable production run
        id: engine
        env:
          SKIP_LARGE: ${{ inputs.skip_large }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          set -o pipefail
          PYTHONPATH=. python -m src.engine.cli all \
            --sources "backup/${DAY}" \
            --data data 2>&1 | tee engine-run.log
          python3 - "$DAY" <<'PY'
          import json
          import pathlib
          import sys
          text = pathlib.Path('engine-run.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('engine JSON result not found')
          obj = json.loads(text[start:])
          if obj.get('status') != 'ok':
              raise SystemExit(f"engine status={obj.get('status')}")
          run_id = obj.get('run_id')
          if not run_id:
              raise SystemExit('engine run_id missing')
          print(f"run_id={run_id}")
          pathlib.Path('engine-run-id.txt').write_text(run_id, encoding='utf-8')
          PY
          echo "run_id=$(cat engine-run-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Schema validate (HARD)
        run: python scripts/schema_validate.py

      - name: Registry validate
        run: python scripts/validate.py

      - name: Dataset diff report
        continue-on-error: true
        run: python scripts/dataset_diff.py

      - name: Dataset quality gate
        run: python scripts/dataset_quality.py

      - name: Coverage matrix (soft)
        continue-on-error: true
        run: python scripts/coverage_matrix.py

      - name: Hot missing audit (soft)
        continue-on-error: true
        run: python scripts/hot_missing_audit.py

      - name: Hierarchy validate (HARD)
        run: python scripts/hierarchy_validate.py

      - name: Hierarchy golden L4/L5 (HARD)
        run: python scripts/hierarchy_golden.py

      - name: Hierarchy coverage (soft)
        continue-on-error: true
        run: python scripts/hierarchy_coverage.py

      - name: Routing decision SSOT
        run: python scripts/routing_emit.py

      - name: Routing contract validate
        run: python scripts/routing_contract_validate.py

      - name: Conflict detector (soft)
        continue-on-error: true
        run: python scripts/conflict_detector.py

      - name: Provenance
        run: python scripts/provenance.py

      - name: Identity validate (soft)
        continue-on-error: true
        run: python scripts/identity_validate.py

      - name: Rule count drift (soft)
        continue-on-error: true
        run: python scripts/rule_count_drift.py

      - name: Quality validate (soft)
        continue-on-error: true
        run: python scripts/quality_validate.py

      - name: Cross-client semantic test (soft)
        continue-on-error: true
        run: python scripts/cross_client_semantic_test.py

      - name: Size gate (HARD)
        run: python scripts/size_gate.py

      - name: Generate docs (soft)
        continue-on-error: true
        run: python scripts/generate_docs.py

      - name: Generate rule pages (HARD)
        run: python scripts/generate_rule_pages.py --clean --strict

      - name: Generate links (soft)
        continue-on-error: true
        run: python scripts/generate_links.py

      # ── PHASE 3: Icon pipeline ──────────────────────────────────────────
      - name: Sync service icons (soft)
        continue-on-error: true
        run: python scripts/sync_service_icons.py

      - name: Icon build (soft)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 2>/dev/null || true
          pip install pillow cairosvg -q || true
          python scripts/icon_policy_set.py || true
          python scripts/icon_restore_si_identity.py || true
          python scripts/icon_no_black.py || true
          python scripts/build_icons.py --force || true
          python scripts/icon_engine.py --force || true
          python scripts/icon_contact_sheet.py || true
          python scripts/icon_dark_contrast_audit.py || true
          python scripts/icon_cleanup_dirs.py || true

      - name: Icon schema migrate (soft)
        continue-on-error: true
        run: python scripts/icon_schema_v2_migrate.py

      - name: Icon registry build (soft)
        continue-on-error: true
        run: python scripts/icon_registry_build.py

      - name: Icon config sync (soft)
        continue-on-error: true
        run: python scripts/icon_config_sync.py

      - name: Icon QA (hard gate)
        run: python scripts/icon_qa.py

      - name: Icon identity audit (soft)
        continue-on-error: true
        run: python scripts/icon_identity_audit.py

      - name: Icon coverage (soft)
        continue-on-error: true
        run: python scripts/icon_coverage.py

      # ── PHASE 4: Commit & push ──────────────────────────────────────────
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          RUN_ID=$(cat engine-run-id.txt)

          DIFF_SUMMARY=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('data/runs') / '${RUN_ID}' / 'reports/diff/latest.json'
          if p.exists():
              d = json.loads(p.read_text())
              print(f\"+{d.get('added',0)}/-{d.get('removed',0)}/~{d.get('changed',0)} rules\")
          else:
              print('diff unavailable')
          " 2>/dev/null || echo "diff unavailable")

          rm -f database/provenance/domains.jsonl
          git add -A \
            generated/ \
            rule/ \
            sources/health.yaml \
            reports/ \
            docs/ \
            assets/ \
            data/ \
            backup/*/manifests/ \
            backup/${DAY}/sources/ \
            || true

          git status --porcelain || true
          git diff --staged --quiet || git commit -m "chore(engine): collect+build ${DAY} | ${DIFF_SUMMARY}"

          git pull --rebase --autostash origin main
          git push
