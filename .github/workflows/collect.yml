name: Collect Upstream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Collect
        run: python scripts/collect.py
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup/
          git diff --staged --quiet || git commit -m "chore(collect): daily upstream backup $(date -u +%Y-%m-%d)"
          git push
