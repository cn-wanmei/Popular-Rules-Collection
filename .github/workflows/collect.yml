name: Collect Upstream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      skip_large:
        description: "Skip mega lists (adblock/china/proxy) for a fast run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-main
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect upstream
        run: python scripts/collect.py

      - name: Normalize
        run: |
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            python scripts/normalize.py --skip-large
          else
            python scripts/normalize.py
          fi

      - name: Canonical deduplicate
        run: python scripts/deduplicate.py

      - name: Conflict detector
        run: python scripts/conflict_detector.py
        continue-on-error: true

      - name: Provenance
        run: python scripts/provenance.py
        continue-on-error: true

      - run: python scripts/build_mihomo.py
      - run: python scripts/build_singbox.py
      - run: python scripts/build_surge.py
      - run: python scripts/build_shadowrocket.py
      - run: python scripts/build_quantumultx.py
      - run: python scripts/build_egern.py

      - name: Validate
        run: python scripts/validate.py
        continue-on-error: true

      - name: Builder validation
        run: python scripts/builder_validate.py
        continue-on-error: true

      - name: Statistics
        run: python scripts/statistics.py
        continue-on-error: true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          git add -A database/ generated/ sources/health.yaml reports/ || true
          git add backup/*/manifests/ backup/ || true
          git diff --staged --quiet || git commit -m "chore(pipeline): collect+normalize+build ${DAY}"
          git push
