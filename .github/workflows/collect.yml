name: Collect Upstream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      skip_large:
        description: "Skip mega lists (adblock/china/proxy) for a fast run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-main
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate_registry.py
      - run: python scripts/collect.py
      - run: python scripts/validate_ip_registry.py
      - run: python scripts/collect_ip.py
      - run: python scripts/ip_quality_audit.py
        continue-on-error: true
      - run: python scripts/validate_dataset_registry.py
      - run: python scripts/build_network_lan.py
      - run: python scripts/collect_datasets.py
      - run: python scripts/build_network_datasets.py
      - run: python scripts/dataset_diff.py
      - run: python scripts/dataset_quality.py
      - run: python scripts/coverage_matrix.py
        continue-on-error: true
      - run: python scripts/hot_missing_audit.py
        continue-on-error: true
      - run: python scripts/collect_providers.py
        continue-on-error: true
      - run: python scripts/build_provider_datasets.py
        continue-on-error: true
      - run: python scripts/client_capability_matrix.py
        continue-on-error: true
      - name: Sync service icons (Simple Icons)
        continue-on-error: true
        run: python scripts/sync_service_icons.py
      - name: Icon build (Final Freeze SSOT)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 2>/dev/null || true
          pip install pillow cairosvg -q || true
          python scripts/icon_policy_set.py || true
          python scripts/icon_restore_si_identity.py || true
          python scripts/icon_no_black.py || true
          python scripts/build_icons.py --force || true
          python scripts/icon_engine.py --force || true
          python scripts/icon_contact_sheet.py || true
          python scripts/icon_dark_contrast_audit.py || true
          python scripts/icon_cleanup_dirs.py || true
      - name: Icon Schema V2 migrate
        continue-on-error: true
        run: python scripts/icon_schema_v2_migrate.py
      - name: Icon registry build
        continue-on-error: true
        run: python scripts/icon_registry_build.py
      - name: Icon config sync (soft)
        continue-on-error: true
        run: python scripts/icon_config_sync.py
      - name: Icon validate (soft)
        continue-on-error: true
        run: python scripts/icon_validate.py
      - name: Icon QA (hard gate)
        run: python scripts/icon_qa.py
      - name: Icon service bidirectional (soft)
        continue-on-error: true
        run: python scripts/icon_service_bidirectional.py
      - name: Icon identity audit (soft)
        continue-on-error: true
        run: python scripts/icon_identity_audit.py
      - name: Icon coverage (soft)
        continue-on-error: true
        run: python scripts/icon_coverage.py
      - name: Icon client adapter (soft)
        continue-on-error: true
        run: python scripts/icon_client_adapter.py
      - name: Icon visual regression (soft)
        continue-on-error: true
        run: |
          python scripts/icon_visual_regression.py || true
      - name: Routing decision SSOT
        run: python scripts/routing_emit.py
      - name: Routing contract validate
        run: python scripts/routing_contract_validate.py
      - name: Build routing policies from decisions
        run: python scripts/build_routing_policies.py
      - name: Profile validate
        run: python scripts/profile_validate.py
      - name: Resolution fragment
        run: python scripts/build_resolution_fragment.py
      - name: V2.1 Artifact manifest
        run: python scripts/build_artifact_manifest.py
      - name: V2.1 Pack release bundle
        continue-on-error: true
        run: python scripts/pack_release_artifacts.py
      - name: V2.2 Source quarantine scan
        continue-on-error: true
        run: python scripts/source_quarantine.py
      - name: V2.3 Gate failure injection
        run: python scripts/gate_failure_injection.py
      - name: V2.5 Hierarchy validate
        continue-on-error: true
        run: python scripts/hierarchy_validate.py
      - name: V2.5 Hierarchy resolve
        continue-on-error: true
        run: python scripts/resolve_hierarchy.py
      - name: V2.5 Hierarchy golden L4/L5
        continue-on-error: true
        run: python scripts/hierarchy_golden.py
      - name: P1 Universal IR
        run: python scripts/build_universal_ir.py
      - name: P1 Semantic dedup report
        continue-on-error: true
        run: python scripts/semantic_dedup.py
      - name: P1 Growth anomaly
        continue-on-error: true
        run: python scripts/growth_anomaly.py
      - name: Normalize
        run: |
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            python scripts/normalize.py --skip-large
          else
            python scripts/normalize.py
          fi
      - run: python scripts/collect_ip.py
      - run: python scripts/deduplicate.py
      - run: python scripts/conflict_detector.py
        continue-on-error: true
      - run: python scripts/provenance.py
      - run: python scripts/build_mihomo.py
      - name: V2.4 Mihomo IR pilot
        run: python scripts/build_mihomo_ir.py
      - name: V2.4 Mihomo IR golden
        run: python scripts/mihomo_ir_golden.py
      - run: python scripts/build_singbox.py
      - run: python scripts/build_surge.py
      - run: python scripts/build_shadowrocket.py
      - run: python scripts/build_quantumultx.py
      - run: python scripts/build_egern.py
      - run: python scripts/build_loon.py
      - name: P1 Artifact provenance
        run: python scripts/attach_artifact_provenance.py
      - name: P1 Cross-client semantic (sample)
        continue-on-error: true
        run: python scripts/cross_client_semantic_test.py
      - run: python scripts/schema_validate.py
      - run: python scripts/validate.py
      - run: python scripts/builder_validate.py
      - run: python scripts/identity_validate.py
        continue-on-error: true
      - run: python scripts/rule_count_drift.py
        continue-on-error: true
      - run: python scripts/quality_validate.py
        continue-on-error: true
      - run: python scripts/statistics.py
        continue-on-error: true
      - run: python scripts/source_snapshot.py
        continue-on-error: true
      - run: python scripts/generated_manifest.py
        continue-on-error: true
      - run: python scripts/release_snapshot.py
        continue-on-error: true
      - run: python scripts/service_score.py
        continue-on-error: true
      - run: python scripts/generate_links.py
        continue-on-error: true
      - run: python scripts/generate_docs.py
        continue-on-error: true
      - name: Generate rule product pages
        run: python scripts/generate_rule_pages.py --clean --strict
      - name: Size gate (90MB)
        run: python scripts/size_gate.py --max-mb 90
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          rm -f database/provenance/domains.jsonl
          git add -A database/ generated/ rule/ sources/health.yaml reports/ docs/ config/ assets/ || true
          git add backup/*/manifests/ backup/ || true
          python scripts/git_skip_release_paths.py || true
          git status --porcelain || true
          python scripts/size_gate.py --max-mb 90
          git diff --staged --quiet || git commit -m "chore(pipeline): collect+normalize+build ${DAY}"
          set +e
          git pull --rebase --autostash origin main
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::rebase conflict — auto-resolve generated health/assets"
            for f in sources/health.yaml; do
              git checkout --theirs -- "$f" 2>/dev/null || true
              git add -- "$f" 2>/dev/null || true
            done
            git diff --name-only --diff-filter=U | while read -r uf; do
              git checkout --theirs -- "$uf" 2>/dev/null || true
              git add -- "$uf" 2>/dev/null || true
            done
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              GIT_EDITOR=true git rebase --continue
              rc=$?
            else
              echo "::warning::no rebase in progress; retry pull --rebase --autostash"
              git pull --rebase --autostash origin main
              rc=$?
            fi
          fi
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::rebase still failed after auto-resolve"
            git status || true
            exit 1
          fi
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, retry pull --rebase ($i)"
            git pull --rebase --autostash origin main || {
              git checkout --theirs -- sources/health.yaml 2>/dev/null || true
              git add sources/health.yaml 2>/dev/null || true
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                GIT_EDITOR=true git rebase --continue || true
              fi
            }
            sleep 5
          done
          git push
