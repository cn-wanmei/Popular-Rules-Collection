name: Collect Upstream

on:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches: [main]
    paths:
      - "sources/registry.yaml"
      - "sources/lifecycle.yaml"
      - "sources/immutable_registry.yaml"
      - "sources/datasets/**"
      - "sources/ip_registry.yaml"
      - "scripts/build_network_bundle.py"
      - "scripts/generated_manifest.py"
  workflow_dispatch:
    inputs:
      skip_large:
        description: "Skip mega service sets for a fast collection"
        type: boolean
        default: false

concurrency:
  group: collect-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Naming Gate
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Resolve collection date
        id: date
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "Collection date: ${DAY}"

      - name: Collection DAG
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.date.outputs.day }}"
          ARGS=(--data data --date "$DAY" --workers 12)
          if [ "${{ inputs.skip_large }}" = "true" ]; then ARGS+=(--skip-large); fi
          set +e
          PYTHONPATH=. python -m src.engine.collection "${ARGS[@]}" > collection-result.json 2> collection-result.stderr.log
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Collection DAG failed with exit code ${rc}."
            echo "--- collection stderr ---"
            cat collection-result.stderr.log || true
            echo "--- collection result ---"
            cat collection-result.json || true
            exit "$rc"
          fi
          python - <<'PY'
          import json
          obj=json.loads(open('collection-result.json',encoding='utf-8').read())
          if obj.get('status') == 'blocked': raise SystemExit(f"collection blocked: {obj.get('critical_failures')}")
          if not obj.get('collection_id') or not obj.get('root'): raise SystemExit('collection identity missing')
          print(obj['collection_id'])
          PY

      - name: Collection Manifest Gate
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.date.outputs.day }}"
          P="backup/${DAY}/manifests/_collection.json"
          test -s "$P"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          day=os.environ["COLLECTION_DAY"]
          obj=json.loads((Path('backup')/day/'manifests/_collection.json').read_text(encoding='utf-8'))
          assert obj['schema']=='collection_manifest_v1'
          assert obj['date']==day
          assert obj['status'] in {'ok','degraded'}
          assert obj['root']==f'backup/{day}'
          assert obj.get('manifest_sha256')
          PY
        env:
          COLLECTION_DAY: ${{ steps.date.outputs.day }}

      - name: Immutable Source Lineage Gate
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.date.outputs.day }}"
          PYTHONPATH=. python scripts/immutable_source_lineage_gate.py \
            --collection-root "backup/${DAY}" \
            --json-out "backup/${DAY}/manifests/immutable-source-lineage.json"

      - name: Collect Network Dataset inputs
        run: |
          set -euo pipefail
          python scripts/collect_datasets.py
          python scripts/collect_ip.py
          python scripts/collect_providers.py

      - name: Materialize unified Network Dataset outputs
        run: |
          set -euo pipefail
          python scripts/build_network_bundle.py --output generated --date "${{ steps.date.outputs.day }}"
          python scripts/generated_manifest.py --root generated --output generated/manifest.json --date "${{ steps.date.outputs.day }}"
      - name: Commit collected snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.date.outputs.day }}"
          rm -f collection-result.json collection-result.stderr.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A "backup/${DAY}/" database/ generated/ data/collection/ sources/health.yaml reports/
          if git diff --staged --quiet; then
            echo "No collection changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(collect): snapshot ${DAY}"

          git add -A "backup/${DAY}/" database/ generated/ data/collection/ sources/health.yaml reports/
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "Collection workspace is dirty after commit. Residual changes:"
            git status --short
            git diff --name-only
            git diff --cached --name-only
            exit 1
          fi

          for attempt in 1 2 3; do
            git fetch --prune origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published collection snapshot on attempt ${attempt}."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Trigger Build Client Rules
        if: ${{ steps.commit.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f collection_date="${{ steps.date.outputs.day }}" \
            -f skip_large="${{ inputs.skip_large }}" \
            -f dry_run=false
          echo "Build Client Rules dispatched for collection ${{ steps.date.outputs.day }}."
