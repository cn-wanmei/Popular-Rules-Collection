name: V1 Phase 3.1 Loader

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/engine/ingest/v1_index.py"
      - "src/engine/ingest/v1_loader.py"
      - "src/engine/ingest/__init__.py"
      - "tests/engine/test_v1_loader.py"
      - ".github/workflows/v1-loader.yml"

jobs:
  v1-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: V1 Loader — unit + pipeline tests
        run: |
          python -m pytest tests/engine/test_v1_loader.py -v \
            --tb=short -q

      - name: V1 Loader — manifest smoke (real data)
        run: |
          python -m src.engine.ingest.v1_loader rule/ --manifest-only
