name: Service Completion Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/service_*.yaml"
      - "config/company_targets.yaml"
      - "scripts/service_completion_gate.py"
      - "reports/**"

jobs:
  service-completion-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/service_completion_gate.py
