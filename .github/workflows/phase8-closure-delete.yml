name: Phase 8 Closure Delete

on:
  push:
    branches: [main]
    paths:
      - ".github/phase8-operator-approval/**"

jobs:
  close:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Verify explicit operator approval
        run: |
          set -euo pipefail
          test -s .github/phase8-operator-approval/APPROVED
          grep -Fx "I explicitly approve Phase 8 Legacy deletion for the current stable main." .github/phase8-operator-approval/APPROVED

      - name: Verify current main is stable
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          local_head="$(git rev-parse HEAD)"
          test "${local_head}" = "${expected}"
          git fetch --prune origin main
          remote_head="$(git rev-parse origin/main)"
          test "${remote_head}" = "${expected}"
          echo "head=${expected}" >> "${GITHUB_OUTPUT}"

      - name: Resolve latest published production run
        id: production
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("reports/latest_release.json").read_text(encoding="utf-8"))
          print(obj["run_id"])
          PY
          )"
          test -d "data/runs/${RUN_ID}"
          test -s "reports/v1/V3_DETERMINISM_FINAL.json"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Regenerate final migration gate against current HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase8-closure
          PYTHONPATH=. python scripts/v1_final_migration_gate.py \
            --run-id "${{ steps.production.outputs.run_id }}" \
            --data-root data \
            --determinism-report reports/v1/V3_DETERMINISM_FINAL.json \
            --expected-commit "${{ steps.stable.outputs.head }}" \
            --json-out /tmp/phase8-closure/FINAL_MIGRATION_GATE.json \
            --phase8-out /tmp/phase8-closure/PHASE8_GATE_REPORT.json \
            --legacy-regression-out /tmp/phase8-closure/LEGACY_REGRESSION_PHASE7.json

      - name: Verify current-head closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("/tmp/phase8-closure/FINAL_MIGRATION_GATE.json").read_text(encoding="utf-8"))
          head = "${{ steps.stable.outputs.head }}"
          assert gate.get("status") == "PASS", gate
          assert gate.get("current_head", {}).get("pass") is True, gate
          assert gate.get("current_head", {}).get("expected") == head, gate
          assert gate.get("current_head", {}).get("actual") == head, gate
          assert gate.get("phase8", {}).get("sot") == "v1_canonical", gate
          assert gate.get("deletion_boundary", {}).get("automatic_delete") is False, gate
          assert gate.get("phase7_finalization", {}).get("pass") is True, gate
          print("closure gate: PASS")
          print("current_head:", head)
          print("run_id:", gate["run_id"])
          PY

      - name: Recheck main stability immediately before deletion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          test "$(git rev-parse HEAD)" = "${{ steps.stable.outputs.head }}"
          test "$(git rev-parse origin/main)" = "${{ steps.stable.outputs.head }}"

      - name: Explicit operator-approved deletion
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/legacy_delete.py \
            --gate /tmp/phase8-closure/FINAL_MIGRATION_GATE.json \
            --approve

      - name: Write deletion audit evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("/tmp/phase8-closure/FINAL_MIGRATION_GATE.json").read_text(encoding="utf-8"))
          out = {
              "schema": "v1_phase8_deletion_final_v1",
              "status": "DELETED",
              "target": "/".join(("database", "services")),
              "operator_approval": True,
              "gate_run_id": gate["run_id"],
              "gate_status": gate["status"],
              "gate_bound_head": gate["current_head"]["actual"],
              "deleted_from_head": "${{ steps.stable.outputs.head }}",
              "automatic_delete": False,
          }
          Path("reports/v1/PHASE8_DELETION_FINAL.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload closure evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase8-closure-${{ github.sha }}
          path: |
            /tmp/phase8-closure/FINAL_MIGRATION_GATE.json
            /tmp/phase8-closure/PHASE8_GATE_REPORT.json
            /tmp/phase8-closure/LEGACY_REGRESSION_PHASE7.json
            reports/v1/LEGACY_FINALIZATION_PHASE7.json
            reports/v1/PHASE8_DELETION_FINAL.json
          if-no-files-found: error
          retention-days: 180

      - name: Restore generated closure evidence before deletion commit
        run: |
          set -euo pipefail
          git checkout -- reports/v1/LEGACY_FINALIZATION_PHASE7.json || true

      - name: Commit Legacy deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database/services reports/v1/PHASE8_DELETION_FINAL.json
          git commit -m "chore(phase8): delete legacy service source"
          git push origin HEAD:main
