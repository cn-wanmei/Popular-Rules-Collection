name: Normalize

on:
  workflow_run:
    workflows: ["Collect Upstream"]
    types: [completed]
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Normalize
        run: python scripts/normalize.py
      - name: Deduplicate
        run: python scripts/deduplicate.py
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --staged --quiet || git commit -m "chore(normalize): update intermediate database $(date -u +%Y-%m-%d)"
          git push
