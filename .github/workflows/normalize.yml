name: Normalize

# Optional standalone; full pipeline is "Collect Upstream"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Normalize
        run: python scripts/normalize.py
      - name: Deduplicate
        run: python scripts/deduplicate.py
        continue-on-error: true
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/ reports/ || true
          git diff --staged --quiet || git commit -m "chore(normalize): update database $(date -u +%Y-%m-%d)"
          git push
