name: Generated Status

on:
  workflow_run:
    workflows: ["Collect Upstream", "Build Client Rules", "Publish Release Candidate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generated-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Classify source health
        run: python scripts/classify_health.py
      - name: Generate publish status
        run: python scripts/generate_publish_status.py
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          publish_status() {
            if git diff --quiet; then
              echo 'No generated status changes.'
              return 0
            fi
            git add reports/source_health_status.yaml PUBLISH_STATUS.md
            # Allow empty-ish situations after concurrent updates
            if git diff --cached --quiet; then
              echo 'No staged status changes after concurrent update.'
              return 0
            fi
            git commit -m 'chore(status): refresh generated release state' || true
          }

          publish_status

          for attempt in 1 2 3; do
            git fetch --prune origin main

            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Generated status published on attempt ${attempt}."
                exit 0
              fi
              echo "Push rejected on attempt ${attempt}; retrying after refresh."
            else
              echo "Status rebase conflict on attempt ${attempt}; regenerating on latest main."
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/classify_health.py
              python scripts/generate_publish_status.py
              publish_status
            fi

            sleep $((attempt * 2))
          done

          echo 'Failed to publish generated status after 3 attempts.'
          exit 1
