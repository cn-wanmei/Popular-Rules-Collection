name: Generated Status

on:
  workflow_run:
    workflows: ["Collect Upstream", "Build Client Rules", "Publish Release Candidate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generated-status
  cancel-in-progress: false

jobs:
  status:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Classify source health
        run: python scripts/classify_health.py
      - name: Generate publish status
        run: python scripts/generate_publish_status.py
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated status changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/source_health_status.yaml PUBLISH_STATUS.md
          git commit -m 'chore(status): refresh generated release state'
          for attempt in 1 2 3; do
            git fetch --prune origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "Status rebase conflict on attempt ${attempt}."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated status published on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Failed to publish generated status after 3 attempts.'
          exit 1
