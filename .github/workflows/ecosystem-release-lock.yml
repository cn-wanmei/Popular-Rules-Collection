name: Ecosystem Release Lock Refresh

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:


jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Write lock
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/write_ecosystem_release_lock.py --require-icon-identity
          PYTHONPATH=. python scripts/verify_ecosystem_release_lock.py
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/ecosystem-release-lock.json
          if git diff --cached --quiet; then
            echo "lock unchanged"
            exit 0
          fi
          git commit -m "chore(lock): refresh ecosystem-release-lock [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
