name: Engine v3 Independent Kernel

on:
  push:
    branches: [main, master]
    paths:
      - "src/engine/**"
      - "tests/engine/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/engine-v3.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/engine/**"
      - "tests/engine/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/engine-v3.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/publish.yml"

jobs:
  engine-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked deps
        run: python -m pip install -r requirements.lock

      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Naming Gate (CLI)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Engine unit tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --tb=short --ignore=tests/engine/unit_legacy_v2_ref

      - name: P1.5 quality and observability tests
        run: PYTHONPATH=. python -m pytest tests/engine/test_p1_5_observability.py -v --tb=short

      - name: V2 runtime dependency must be 0
        run: PYTHONPATH=. python -c "from src.engine import __v2_runtime_dependency__; assert __v2_runtime_dependency__ == 0; print('v2_runtime_dependency=0 OK')"
