name: Engine v3 Independent Kernel

on:
  push:
    branches: [main, master]
    paths:
      - "src/engine/**"
      - "tests/engine/**"
      - "scripts/collect.py"
      - "scripts/fetchers/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/engine-v3.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/engine/**"
      - "tests/engine/**"
      - "scripts/collect.py"
      - "scripts/fetchers/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/engine-v3.yml"

jobs:
  engine-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Naming Gate (CLI)
        run: |
          PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Engine unit tests
        run: |
          PYTHONPATH=. python -m pytest tests/engine/ -v --tb=short \
            --ignore=tests/engine/unit_legacy_v2_ref

      - name: P1.5 quality and observability tests
        run: |
          PYTHONPATH=. python -m pytest tests/engine/test_p1_5_observability.py -v --tb=short

      - name: V2 runtime dependency must be 0
        run: |
          PYTHONPATH=. python -c "
          from src.engine import __v2_runtime_dependency__
          assert __v2_runtime_dependency__ == 0
          print('v2_runtime_dependency=0 OK')
          "
