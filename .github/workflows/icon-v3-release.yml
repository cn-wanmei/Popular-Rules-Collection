name: Icon System 3 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable icon release version, e.g. 2026.09.22-r1"
        required: true
        type: string

concurrency:
  group: icon-v3-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Build Icon System 3
        run: python scripts/icon_system_v3.py all --out build/icon-v3
      - name: Fail-closed Icon QA
        run: python scripts/icon_v3_gate.py --build-root build/icon-v3
      - name: Collect upstream metadata
        run: python scripts/icon_v3_collect.py --fetch --output build/icon-v3/upstream-sources.json
      - name: Materialize immutable release
        env:
          ICON_VERSION: ${{ inputs.version }}
        run: python scripts/icon_v3_release.py --build-root build/icon-v3 --version "${ICON_VERSION}"
      - name: Commit release to current phase2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/v3/
          if git diff --cached --quiet; then
            echo "No icon release changes."
            exit 0
          fi
          git commit -m "feat(icons): materialize Icon System 3 release ${{ inputs.version }}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
