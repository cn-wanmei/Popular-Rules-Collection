name: Client GitHub Release Packages

# Produces the 7 client zip artifacts + RELEASE_NOTES and publishes a GitHub Release.
# Safe to run after a successful Publish Release Candidate.

on:
  workflow_dispatch:
    inputs:
      stamp:
        description: "Override stamp (default: current UTC). Format example 2026-10-2-13[03:57]"
        required: false
        type: string
        default: ""
      dry_run:
        description: "If true, only package artifacts, do not create GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  group: client-github-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package 7 client zips
        id: pkg
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.stamp }}" ]; then
            python scripts/package_client_releases.py \
              --generated-root generated \
              --out-dir release-packages \
              --stamp "${{ inputs.stamp }}"
          else
            python scripts/package_client_releases.py \
              --generated-root generated \
              --out-dir release-packages
          fi
          STAMP=$(python -c "import json; print(json.load(open('release-packages/release-meta.json'))['stamp'])")
          SAFE_STAMP=$(echo "$STAMP" | tr '[]:' '---' | tr -s '-' | sed 's/-$//')
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "safe_stamp=$SAFE_STAMP" >> "$GITHUB_OUTPUT"
          ls -la release-packages/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-release-packages-${{ steps.pkg.outputs.safe_stamp }}
          path: release-packages/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAMP="${{ steps.pkg.outputs.stamp }}"
          SAFE_TAG="rules-${{ steps.pkg.outputs.safe_stamp }}"
          BODY_FILE=release-packages/RELEASE_NOTES.md
          # Idempotent: delete same tag if exists
          if gh release view "$SAFE_TAG" >/dev/null 2>&1; then
            gh release delete "$SAFE_TAG" --yes || true
            git push origin ":refs/tags/$SAFE_TAG" || true
          fi
          gh release create "$SAFE_TAG" \
            --title "Rules Collection — ${STAMP}" \
            --notes-file "$BODY_FILE" \
            release-packages/*.zip \
            release-packages/RELEASE_NOTES.md \
            release-packages/SHA256SUMS.txt \
            release-packages/release-meta.json
          echo "Created release: $SAFE_TAG"
