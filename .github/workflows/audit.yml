name: P3 Audit Gates

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/engine/audit/**"
      - "tests/engine/test_p3_audit.py"
      - "scripts/p3_audit.py"
      - "config/p3_audit.yaml"
      - "requirements.lock"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "src/engine/audit/**"
      - "tests/engine/test_p3_audit.py"
      - "scripts/p3_audit.py"
      - "config/p3_audit.yaml"
      - "requirements.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  p3-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked deps
        run: python -m pip install -r requirements.lock
      - name: P3 unit tests
        run: PYTHONPATH=. python -m pytest tests/engine/test_p3_audit.py -q
      - name: Dependency lock gate
        run: PYTHONPATH=. python scripts/p3_audit.py lock
      - name: Action SHA gate
        run: PYTHONPATH=. python scripts/p3_audit.py actions
      - name: SBOM generation
        run: PYTHONPATH=. python scripts/p3_audit.py sbom
      - name: Checksum fixture
        run: mkdir -p generated && printf 'p3-audit-fixture\n' > generated/.audit-fixture && PYTHONPATH=. python scripts/p3_audit.py checksums
