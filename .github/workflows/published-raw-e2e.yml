name: Published Raw E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Release Candidate"]
    types: [completed]
  schedule:
    - cron: "50 6 * * *"

concurrency:
  group: published-raw-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Fetch and sanity-check public raw artifacts
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Public raw fail-closed checks
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw-e2e
          BASE="https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main"

          fetch_ok() {
            local path="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" "$BASE/$path" || echo "000")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Raw E2E fail-closed: $path returned HTTP $code"
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "::error::Raw E2E fail-closed: $path empty body"
              exit 1
            fi
          }

          # Authority surfaces
          fetch_ok "rule/_index.yaml" "/tmp/raw-e2e/_index.yaml"
          fetch_ok "PUBLISH_STATUS.md" "/tmp/raw-e2e/PUBLISH_STATUS.md"

          # Machine-consumed distribution manifest (not human README)
          fetch_ok "generated/manifest.json" "/tmp/raw-e2e/manifest.json"

          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import urllib.request

          BASE = "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main"
          CLIENTS = ("mihomo", "singbox", "surge", "shadowrocket", "quantumultx", "egern", "loon")

          index_text = Path("/tmp/raw-e2e/_index.yaml").read_text(encoding="utf-8")
          if len(index_text) < 1000:
              raise SystemExit(f"index too small: {len(index_text)}")
          n = len(re.findall(r"(?m)^\s*entity:\s*service\s*$", index_text))
          if n < 10:
              raise SystemExit(f"unexpectedly few entity: service lines: {n}")
          print(f"index_ok bytes={len(index_text)} entity_service_lines={n}")

          manifest = json.loads(Path("/tmp/raw-e2e/manifest.json").read_text(encoding="utf-8"))
          dirs = manifest.get("client_rule_directories") or []
          missing_dirs = [c for c in CLIENTS if c not in dirs]
          if missing_dirs:
              raise SystemExit(f"manifest missing client dirs: {missing_dirs}; have={dirs}")
          print(f"manifest_ok clients={dirs} file_count={manifest.get('file_count')}")

          files = manifest.get("files") or []
          by_client: dict[str, str] = {}
          for entry in files:
              if not isinstance(entry, dict):
                  continue
              if entry.get("kind") != "client_rules":
                  continue
              path = entry.get("file") or ""
              scope = entry.get("scope") or (path.split("/")[0] if path else "")
              if scope in CLIENTS and scope not in by_client:
                  by_client[scope] = path

          missing_leaf = [c for c in CLIENTS if c not in by_client]
          if missing_leaf:
              raise SystemExit(f"no client_rules leaf in manifest for: {missing_leaf}")

          def fetch(rel: str) -> bytes:
              url = f"{BASE}/generated/{rel}"
              req = urllib.request.Request(url, headers={"User-Agent": "published-raw-e2e"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  body = resp.read()
              if not body:
                  raise SystemExit(f"empty body: generated/{rel}")
              return body

          for client in CLIENTS:
              rel = by_client[client]
              body = fetch(rel)
              text = body.decode("utf-8", errors="replace")
              if len(text.strip()) < 8:
                  raise SystemExit(f"leaf too thin: {rel}")
              print(f"client_leaf_ok client={client} path=generated/{rel} bytes={len(body)}")

          # A few rule-tree leaves from human index (optional depth)
          paths = []
          for m in re.finditer(r"(?m)^\s*- path:\s*(\S+)\s*$", index_text):
              p = m.group(1).strip().strip("'\"")
              if p.endswith((".yaml", ".yml")):
                  paths.append(p if p.startswith("rule/") else f"rule/{p}")
              if len(paths) >= 3:
                  break
          for path in paths:
              url = f"{BASE}/{path}"
              req = urllib.request.Request(url, headers={"User-Agent": "published-raw-e2e"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  body = resp.read()
              if not body:
                  raise SystemExit(f"rule leaf empty: {path}")
              print(f"rule_leaf_ok path={path} bytes={len(body)}")

          print("Published Raw E2E: PASS (manifest + 7 client leaves + index)")
          PY
