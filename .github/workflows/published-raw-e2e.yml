name: Published Raw E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Release Candidate"]
    types: [completed]
  schedule:
    - cron: "50 6 * * *"

concurrency:
  group: published-raw-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Fetch and sanity-check public raw artifacts
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Public raw fail-closed checks
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw-e2e
          BASE="https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main"

          fetch_ok() {
            local path="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" "$BASE/$path" || echo "000")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Raw E2E fail-closed: $path returned HTTP $code"
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "::error::Raw E2E fail-closed: $path empty body"
              exit 1
            fi
          }

          # Authority / status surfaces
          fetch_ok "rule/_index.yaml" "/tmp/raw-e2e/_index.yaml"
          fetch_ok "PUBLISH_STATUS.md" "/tmp/raw-e2e/PUBLISH_STATUS.md"

          # All 7 client entry READMEs (directory presence + public reachability)
          for client in mihomo sing-box surge shadowrocket quantumultx egern loon; do
            fetch_ok "generated/${client}/README.md" "/tmp/raw-e2e/${client}-README.md"
          done

          # Representative leaf artifacts (stable paths from human index entries)
          # Prefer a few known-small services if present; otherwise pick first service leaf from index via python below.

          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          BASE = "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main"
          index_text = Path("/tmp/raw-e2e/_index.yaml").read_text(encoding="utf-8")
          if len(index_text) < 1000:
              raise SystemExit(f"index too small: {len(index_text)}")
          if "schema:" not in index_text and "entries:" not in index_text:
              raise SystemExit("index missing schema/entries markers")
          n = len(re.findall(r"(?m)^\s*entity:\s*service\s*$", index_text))
          print(f"raw_e2e: index_bytes={len(index_text)} entity_service_lines={n}")
          if n < 10:
              raise SystemExit("unexpectedly few entity: service lines in public index")

          # Collect a few service rule paths from index
          paths = []
          for m in re.finditer(r"(?m)^\s*- path:\s*(\S+)\s*$", index_text):
              p = m.group(1).strip().strip("'\"")
              if p.endswith(".yaml") or p.endswith(".yml"):
                  paths.append("rule/" + p if not p.startswith("rule/") else p)
              if len(paths) >= 5:
                  break

          def fetch(path: str) -> bytes:
              url = f"{BASE}/{path}"
              req = urllib.request.Request(url, headers={"User-Agent": "published-raw-e2e"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  if getattr(resp, "status", 200) not in (200, None):
                      raise SystemExit(f"leaf HTTP {resp.status}: {path}")
                  body = resp.read()
              if not body:
                  raise SystemExit(f"leaf empty: {path}")
              return body

          for path in paths:
              body = fetch(path)
              text = body.decode("utf-8", errors="replace")
              # minimal YAML/list sanity
              if not any(k in text for k in ("DOMAIN", "domain", "payload", "rules", "HOST", "ip-cidr", "IP-CIDR", "-") ):
                  # still accept if non-empty structured-ish
                  if len(text.strip()) < 8:
                      raise SystemExit(f"leaf too thin: {path}")
              print(f"leaf_ok path={path} bytes={len(body)}")

          # Client generated manifests if present
          for client in ("mihomo", "sing-box", "surge", "shadowrocket", "quantumultx", "egern", "loon"):
              for rel in (f"generated/{client}/manifest.json", f"generated/{client}/README.md"):
                  try:
                      body = fetch(rel)
                      print(f"client_ok path={rel} bytes={len(body)}")
                      break
                  except Exception as exc:
                      # README already enforced via curl; manifest optional per client layout
                      print(f"client_optional_skip path={rel} err={exc}")

          print("Published Raw E2E: PASS (fail-closed HTTP + 7 clients + leaf samples)")
          PY
