name: Published Raw E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Release Candidate"]
    types: [completed]
  schedule:
    - cron: "50 6 * * *"

permissions:
  contents: read

concurrency:
  group: published-raw-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Fetch and sanity-check public raw artifacts
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download public index + sample client paths
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw-e2e
          BASE="https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main"

          curl -fsSL "$BASE/rule/_index.yaml" -o /tmp/raw-e2e/_index.yaml
          # Prefer a stable small path if present; fall back to index-only
          for path in \
            "generated/mihomo/README.md" \
            "generated/sing-box/README.md" \
            "PUBLISH_STATUS.md"
          do
            code=$(curl -sS -o "/tmp/raw-e2e/$(basename "$path")" -w "%{http_code}" "$BASE/$path" || true)
            echo "$path -> HTTP $code"
          done

          python - <<'PY'
          from pathlib import Path
          import re

          index = Path("/tmp/raw-e2e/_index.yaml").read_text(encoding="utf-8")
          if len(index) < 1000:
              raise SystemExit(f"index too small: {len(index)}")
          if "schema:" not in index and "entries:" not in index:
              raise SystemExit("index missing schema/entries markers")
          # Count entity: service occurrences as weak coverage signal (not SSOT)
          n = len(re.findall(r"(?m)^\s*entity:\s*service\s*$", index))
          print(f"raw_e2e: index_bytes={len(index)} entity_service_lines={n}")
          if n < 10:
              raise SystemExit("unexpectedly few entity: service lines in public index")

          status = Path("/tmp/raw-e2e/PUBLISH_STATUS.md")
          if status.is_file():
              print(f"publish_status_bytes={status.stat().st_size}")
          print("Published Raw E2E: PASS")
          PY
