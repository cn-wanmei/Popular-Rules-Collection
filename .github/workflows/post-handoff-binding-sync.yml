name: Post-Handoff Binding Sync

on:
  push:
    branches: [main]
    paths:
      - "sources/immutable_registry.yaml"
  workflow_dispatch:

concurrency:
  group: post-handoff-binding-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Sync registry / primary / hierarchy to active bindings
        run: python scripts/sync_active_bindings_to_registry.py

      - name: Open PR if changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No binding sync changes."
            exit 0
          fi
          BRANCH="automation/post-handoff-binding-sync-$(git rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add sources/registry.yaml config/service_primary.yaml config/ruleset_hierarchy.yaml
          git commit -m "chore(source): sync registry/primary/hierarchy to active bindings"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(source): sync registry/primary/hierarchy to active bindings" \
            --body "Automated post-handoff alignment so Lineage Gate never sees active binds without enabled rules." || true
