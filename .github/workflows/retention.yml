name: Retention Policy

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply destructive retention deletes'
        required: true
        default: false
        type: boolean

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run retention planner
        env:
          APPLY: ${{ inputs.apply || false }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/retention.py --apply
          else
            python scripts/retention.py --dry-run
          fi
      - name: Commit applied retention changes
        if: inputs.apply == true
        run: |
          if git diff --quiet; then
            echo 'No retention changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup reports data/runs
          git commit -m 'chore(retention): purge expired historical data' || exit 0
          git push
