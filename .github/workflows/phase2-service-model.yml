name: Phase 2 Service Model Unification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/engine/service_model/**"
      - "tests/engine/test_phase2_service_model.py"
      - "docs/PHASE2_SERVICE_MODEL_UNIFICATION.md"
      - ".github/workflows/phase2-service-model.yml"
  workflow_dispatch:

jobs:
  phase2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install -r requirements.lock
      - name: Architecture Gate
        run: python scripts/architecture_gate.py
      - name: Phase 2 focused tests
        run: PYTHONPATH=. python -m pytest tests/engine/test_phase2_service_model.py -q
