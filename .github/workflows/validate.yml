name: Validate

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked deps
        run: python -m pip install -r requirements.lock

      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Naming gate
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Engine unit + contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --tb=short --ignore=tests/engine/unit_legacy_v2_ref

      - name: IP registry validate
        run: python scripts/validate_ip_registry.py

      - name: Icon validate (soft)
        continue-on-error: true
        run: python scripts/icon_validate.py

      - name: Dataset quality gate
        run: |
          python scripts/dataset_diff.py
          python scripts/dataset_quality.py

      - name: Generated size gate (HARD)
        run: python scripts/size_gate.py
