name: Validate

on:
  workflow_run:
    workflows:
      - Build Client Rules
      - Collect Upstream
    types: [completed]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Naming gate (HARD)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate
      - name: Engine unit + contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --tb=short
      - name: IP registry validate
        run: python scripts/validate_ip_registry.py
      - name: Icon validate (soft)
        continue-on-error: true
        run: python scripts/icon_validate.py
      - name: Dataset quality gate
        run: |
          python scripts/dataset_diff.py
          python scripts/dataset_quality.py
      - name: Generated size gate (HARD)
        run: python scripts/size_gate.py
