name: Validate

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked deps
        run: python -m pip install -r requirements.lock

      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Naming gate
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Engine unit + contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --tb=short

      - name: IP registry validate
        run: python scripts/validate_ip_registry.py

      - name: Icon validate (soft)
        continue-on-error: true
        run: python scripts/icon_validate.py

      - name: Dataset quality gate
        run: |
          python scripts/dataset_diff.py
          python scripts/dataset_quality.py

      - name: Generated size gate (HARD)
        run: python scripts/size_gate.py

      - name: Phase 2 Active-Service Canary
        id: phase2_canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/phase2-canary
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path
          import yaml

          with open("config/source_canary_state.yaml", encoding="utf-8") as fh:
              state = yaml.safe_load(fh) or {}
          services = state.get("services") or {}
          active = sorted(
              sid for sid, item in services.items()
              if isinstance(item, dict)
              and item.get("state") == "canary"
              and item.get("enabled") is True
          )
          print("active canary services:", active)
          github_env = os.environ["GITHUB_ENV"]
          if not active:
              with open(github_env, "a", encoding="utf-8") as out:
                  out.write("CANARY_ACTIVE=false\n")
              Path("reports/phase2-canary/source-verification.json").write_text(
                  json.dumps(
                      {"source_commit": None, "observed_source_gates": {}, "services": []},
                      ensure_ascii=False, indent=2
                  ) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Popular-Rules-Collection-Phase2",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          pr = get_json("https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/pulls/2")
          source_sha = pr["head"]["sha"]
          needed = {"CI", "Phase 2 Source Gate"}
          observed = {}

          for attempt in range(30):
              runs = get_json(
                  "https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/actions/runs"
                  f"?head_sha={source_sha}&per_page=100"
              )
              latest = {}
              for run in runs.get("workflow_runs", []):
                  name = run.get("name")
                  if name not in needed:
                      continue
                  previous = latest.get(name)
                  if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                      latest[name] = run

              observed = {name: run.get("conclusion") for name, run in latest.items()}
              statuses = {name: run.get("status") for name, run in latest.items()}
              print(json.dumps(
                  {"attempt": attempt + 1, "source_commit": source_sha, "observed": observed, "statuses": statuses},
                  ensure_ascii=False,
                  indent=2,
              ))

              missing = sorted(needed - observed.keys())
              terminal_bad = sorted(
                  name for name, conclusion in observed.items()
                  if conclusion not in (None, "success")
              )
              if terminal_bad:
                  raise SystemExit(
                      f"Source PR #2 has failed gate(s) for {source_sha}: {terminal_bad}; observed={observed}"
                  )
              if not missing and all(observed.get(name) == "success" for name in needed):
                  break
              if attempt == 29:
                  raise SystemExit(
                      f"Timed out waiting for Source PR #2 gates for {source_sha}; observed={observed}, missing={missing}"
                  )
              time.sleep(20)

          with open(github_env, "a", encoding="utf-8") as out:
              out.write("CANARY_ACTIVE=true\n")
              out.write(f"SOURCE_CANARY_SHA={source_sha}\n")
              out.write("ACTIVE_CANARY_SERVICES=" + " ".join(active) + "\n")

          Path("reports/phase2-canary/source-verification.json").write_text(
              json.dumps(
                  {"source_commit": source_sha, "observed_source_gates": observed, "services": active},
                  ensure_ascii=False, indent=2
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Checkout exact Source PR commit for Canary
        if: env.CANARY_ACTIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cn-wanmei/Popular-Rules-Source
          ref: ${{ env.SOURCE_CANARY_SHA }}
          path: .phase2/source
          fetch-depth: 1

      - name: Verify exact Source Canary commit
        if: env.CANARY_ACTIVE == 'true'
        run: test "$(git -C .phase2/source rev-parse HEAD)" = "${SOURCE_CANARY_SHA}"

      - name: Install Source runtime dependencies
        if: env.CANARY_ACTIVE == 'true'
        run: python -m pip install "jsonschema>=4.21,<5"

      - name: Run active-service Source → V3 Canary and rollback rehearsal
        if: env.CANARY_ACTIVE == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/phase2_source_canary.py \
            --source-root .phase2/source \
            --source-commit "${SOURCE_CANARY_SHA}" \
            --services ${ACTIVE_CANARY_SERVICES} \
            --output reports/phase2-canary

      - name: Upload Phase 2 Canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-canary-${{ github.sha }}
          path: reports/phase2-canary
          if-no-files-found: warn
          retention-days: 30

