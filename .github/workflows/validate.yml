name: Validate

on:
  workflow_run:
    workflows: ["Build Client Rules"]
    types: [completed]
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Validate
        run: python scripts/validate.py
