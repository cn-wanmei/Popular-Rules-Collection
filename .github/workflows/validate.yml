name: Validate

on:
  workflow_run:
    workflows:
      - Build Client Rules
      - Collect Upstream
    types: [completed]
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Skip re-run noise when collect already hard-gated; still useful for PR/Build
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the triggering commit when available
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Schema validate
        run: python scripts/schema_validate.py
      - name: Validate
        run: python scripts/validate.py
      - name: Builder validate
        run: python scripts/builder_validate.py
