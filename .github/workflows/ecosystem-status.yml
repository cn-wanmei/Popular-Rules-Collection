name: Ecosystem Status (Read Model)

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: ecosystem-status-read-model
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ecosystem_release_status.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate read model
        run: python scripts/generate_ecosystem_release_status.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          git add reports/ecosystem_release_status.json
          if git diff --cached --quiet; then
            echo "No ecosystem status change"
          else
            git commit -m "chore(status): refresh ecosystem_release_status read model [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ecosystem-release-status
          path: reports/ecosystem_release_status.json
          if-no-files-found: warn
