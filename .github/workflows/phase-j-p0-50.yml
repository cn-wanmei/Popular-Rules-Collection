name: Phase J P0 50 Service
on:
  pull_request:
  workflow_dispatch:
    inputs:
      enforce:
        description: Hard-fail unless all 50 P0 services are production
        required: false
        default: "false"
        type: choice
        options: ["false","true"]
jobs:
  phase-j-p0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python scripts/phase_j_p0_50_gate.py --json-out reports/v1/PHASE_J_P0_50_GATE.json
      - if: github.event_name == 'workflow_dispatch' && inputs.enforce == 'true'
        run: python scripts/phase_j_p0_50_gate.py --enforce
