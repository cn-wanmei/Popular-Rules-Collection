name: P0 Batch 01 Runtime Semantic Audit
on:
  pull_request:
    paths:
      - "config/p0_batch01_snapshots/**"
      - "config/p0_batch01_semantic_audit.yaml"
      - "config/p0_batch01_overlap_audit.yaml"
      - "scripts/p0_batch01_semantic_overlap_audit.py"
      - "scripts/p0_batch01_semantic_overlap_report.py"
      - ".github/workflows/p0-batch01-runtime-audit.yml"
  workflow_dispatch:
jobs:
  batch01-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30de800
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install pyyaml
      - run: python -m py_compile scripts/p0_batch01_semantic_overlap_audit.py scripts/p0_batch01_semantic_overlap_report.py
      - name: Execute read-only Batch 01 audit
        run: python scripts/p0_batch01_semantic_overlap_report.py
