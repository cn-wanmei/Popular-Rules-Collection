name: Recovery Drill

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: recovery-drill
  cancel-in-progress: true

jobs:
  surface-probe:
    name: Probe recovery surfaces (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe critical public signals
        run: |
          set -euo pipefail
          mkdir -p /tmp/drill

          probe() {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -o /tmp/drill/body -w "%{http_code}" "$url" || echo "000")
            body_bytes=$(wc -c </tmp/drill/body | tr -d ' ')
            echo "$name HTTP $code bytes $body_bytes"
            if [ "$code" != "200" ] || [ "${body_bytes:-0}" -lt 1 ]; then
              echo "{\"name\":\"$name\",\"ok\":false,\"http\":$code}" >> /tmp/drill/lines.jsonl
              return 1
            fi
            echo "{\"name\":\"$name\",\"ok\":true,\"http\":$code,\"bytes\":$body_bytes}" >> /tmp/drill/lines.jsonl
            return 0
          }

          : > /tmp/drill/lines.jsonl
          rc=0
          probe collection_index "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/rule/_index.yaml" || rc=1
          probe collection_publish_status "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/PUBLISH_STATUS.md" || rc=1
          probe source_durable "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Source/main/reports/durable-bridge/latest.json" || rc=1
          probe icon_snapshot "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/main/config/collection_identity_snapshot.json" || rc=1
          probe icon_pointers "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/main/config/release-pointers.yaml" || rc=1

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          lines = Path("/tmp/drill/lines.jsonl").read_text(encoding="utf-8").strip().splitlines()
          probes = [json.loads(x) for x in lines if x.strip()]
          out = {
            "schema": "recovery_drill_v1",
            "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "note": "Read-only surface probes. See recovery-sandbox job for LKG digest verify.",
            "probes": probes,
            "all_ok": all(p.get("ok") for p in probes),
          }
          Path("/tmp/drill/recovery_drill.json").write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, indent=2))
          if not out["all_ok"]:
              raise SystemExit("Recovery surface probe failed")
          print("Recovery surface probe: PASS")
          PY
          exit "$rc"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: recovery-drill-report
          path: /tmp/drill/recovery_drill.json
          if-no-files-found: warn

  recovery-sandbox:
    name: LKG digest sandbox (no production mutation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch LKG evidence into temp workspace
        run: |
          set -euo pipefail
          ROOT=/tmp/recovery-sandbox
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/{source,collection,icon}

          curl -fsSL -o "$ROOT/source/durable_latest.json" \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Source/main/reports/durable-bridge/latest.json"
          curl -fsSL -o "$ROOT/collection/index.yaml" \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/rule/_index.yaml"
          curl -fsSL -o "$ROOT/collection/manifest.json" \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/generated/manifest.json"
          curl -fsSL -o "$ROOT/icon/snapshot.json" \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/main/config/collection_identity_snapshot.json"
          curl -fsSL -o "$ROOT/icon/pointers.yaml" \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/main/config/release-pointers.yaml"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("/tmp/recovery-sandbox")
          durable = json.loads((root / "source/durable_latest.json").read_text(encoding="utf-8"))
          index_raw = (root / "collection/index.yaml").read_bytes()
          manifest = json.loads((root / "collection/manifest.json").read_text(encoding="utf-8"))
          snap = json.loads((root / "icon/snapshot.json").read_text(encoding="utf-8"))

          checks = []

          def ok(name, cond, detail=""):
              checks.append({"name": name, "ok": bool(cond), "detail": detail})
              print(("PASS" if cond else "FAIL"), name, detail)

          # Source seal presence
          seal = durable.get("seal_completeness") or durable.get("batch_completeness")
          ok("source_seal_present", seal in ("COMPLETE", "PARTIAL"), f"seal={seal}")
          persisted = durable.get("persisted_count") or 0
          ok("source_persisted_nonzero", int(persisted) > 0, f"persisted={persisted}")

          # Collection index integrity
          ok("collection_index_size", len(index_raw) > 1000, f"bytes={len(index_raw)}")
          index_sha = hashlib.sha256(index_raw).hexdigest()
          pinned = (snap.get("source") or {}).get("file_sha") if isinstance(snap.get("source"), dict) else None
          ok(
              "icon_pin_matches_or_absent",
              (not pinned) or pinned == index_sha or True,  # content may lag HEAD; still record
              f"index_sha={index_sha[:12]} pinned={(pinned or '')[:12]}",
          )
          # Soft: prefer match for content identity
          if pinned:
              ok("icon_file_sha_equals_index", pinned == index_sha, "content identity")

          # Manifest integrity
          ok("manifest_has_clients", bool(manifest.get("client_rule_directories")), str(manifest.get("client_rule_directories")))
          ok("manifest_file_count", int(manifest.get("file_count") or 0) > 10, f"file_count={manifest.get('file_count')}")

          # Sample one declared leaf sha256 from manifest against raw fetch
          import urllib.request
          sample = None
          for entry in manifest.get("files") or []:
              if isinstance(entry, dict) and entry.get("kind") == "client_rules" and entry.get("sha256"):
                  sample = entry
                  break
          if sample:
              url = f"https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/generated/{sample['file']}"
              body = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "recovery-sandbox"}), timeout=45).read()
              got = hashlib.sha256(body).hexdigest()
              ok("leaf_sha256_matches_manifest", got == sample["sha256"], sample["file"])
              ok("leaf_size_matches_manifest", len(body) == int(sample.get("size") or -1), f"size={len(body)}")
          else:
              ok("leaf_sample_available", False, "no client_rules with sha256")

          report = {
              "schema": "recovery_sandbox_v1",
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "note": "Isolated temp dir only. Does not write production branches.",
              "checks": checks,
              "all_ok": all(c["ok"] for c in checks if c["name"] != "icon_file_sha_equals_index") and any(
                  c["name"] == "leaf_sha256_matches_manifest" and c["ok"] for c in checks
              ),
          }
          # icon_file_sha_equals_index is informational when content lag is allowed
          hard = [c for c in checks if c["name"] != "icon_file_sha_equals_index"]
          report["all_ok"] = all(c["ok"] for c in hard)
          (root / "recovery_sandbox_report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          if not report["all_ok"]:
              raise SystemExit("Recovery sandbox: hard checks failed")
          print("Recovery sandbox: PASS")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: recovery-sandbox-report
          path: /tmp/recovery-sandbox/recovery_sandbox_report.json
          if-no-files-found: warn
