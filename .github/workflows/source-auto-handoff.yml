name: Source Auto Handoff

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Evaluate Source durable seal
        run: python scripts/source_auto_handoff.py | tee /tmp/source-handoff.json
      - name: Open immutable binding PR
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          if git diff --quiet -- sources/immutable_registry.yaml; then
            echo "No Source binding changes."
            exit 0
          fi

          SOURCE_REF=$(python -c 'import json; print(json.load(open("/tmp/source-handoff.json"))["source_ref"])')
          BRANCH="automation/source-handoff-\${SOURCE_REF:0:12}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "An existing handoff branch already carries this Source seal: $BRANCH"
            exit 0
          fi

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/immutable_registry.yaml
          git commit -m "chore(source): promote immutable Source seal"
          git push origin "$BRANCH"

          NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(source): promote immutable Source seal" \
              --body "Automated handoff from Popular-Rules-Source durable bridge. This PR only updates immutable Source bindings; existing Collection Source Gate/Canary/Production controls remain authoritative."
          fi
