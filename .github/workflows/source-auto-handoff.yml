name: Source Auto Handoff

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: source-auto-handoff-main
  cancel-in-progress: true

jobs:
  handoff:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install -r requirements.lock

      - name: Materialize and verify current Source durable seal
        run: |
          python scripts/source_auto_handoff.py | tee /tmp/source-handoff.json
          python scripts/source_provenance_gate.py

      - name: Open immutable binding PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- sources/immutable_registry.yaml; then
            echo "No Source binding changes."
            exit 0
          fi

          SOURCE_REF=$(python -c 'import json; print(json.load(open("/tmp/source-handoff.json"))["source_ref"])')
          test "${#SOURCE_REF}" -eq 40

          git fetch origin main
          git checkout -B main origin/main
          python scripts/source_auto_handoff.py > /tmp/source-handoff-rebase.json
          python scripts/source_provenance_gate.py
          git add sources/immutable_registry.yaml

          if git diff --cached --quiet; then
            echo "Collection main already contains the current Source seal."
            exit 0
          fi

          BRANCH="automation/source-handoff-$SOURCE_REF"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Handoff branch already exists: $BRANCH"
            exit 0
          fi

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(source): promote immutable Source durable seal"
          git push --set-upstream origin "$BRANCH"

          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^1$'; then
            echo "Handoff PR already exists for $BRANCH"
            exit 0
          fi

          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "chore(source): promote immutable Source durable seal"             --body "Automated Collection-owned Source handoff. The workflow consumes the Source durable seal, verifies the complete provenance identity at the exact immutable Source persistence commit, and opens a normal Collection PR. Collection Source Gate, Canary, and Production promotion remain authoritative."
