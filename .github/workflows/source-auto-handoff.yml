name: Source Auto Handoff

on:
  push:
    branches: [main]
    paths:
      - "scripts/source_auto_handoff.py"
      - ".github/workflows/source-auto-handoff.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: source-auto-handoff-main
  cancel-in-progress: true

jobs:
  handoff:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install -r requirements.lock

      - name: Sync Collection main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Materialize and verify current Source durable seal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_auto_handoff.py | tee /tmp/source-handoff.json
          python scripts/source_provenance_gate.py

      - name: Open immutable binding PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_REF=$(python -c 'import json; print(json.load(open("/tmp/source-handoff.json"))["source_ref"])')
          test "${#SOURCE_REF}" -eq 40

          BRANCH="automation/source-handoff-$SOURCE_REF"

          if git diff --quiet -- sources/immutable_registry.yaml; then
            echo "No Source binding changes."
            printf 'handoff_status=NO_BINDING_CHANGES\nsource_ref=%s\nbranch=%s\n' "$SOURCE_REF" "$BRANCH" > source-handoff-status.txt
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Handoff branch already exists: $BRANCH"
            EXISTING_PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,url --jq '.[0] // empty')"
            if [ -n "$EXISTING_PR_JSON" ]; then
              PR_NUMBER="$(printf '%s' "$EXISTING_PR_JSON" | jq -r '.number')"
              PR_URL="$(printf '%s' "$EXISTING_PR_JSON" | jq -r '.url')"
              printf 'handoff_status=PR_EXISTS\nsource_ref=%s\nbranch=%s\npr_number=%s\n' "$SOURCE_REF" "$BRANCH" "$PR_NUMBER" > source-handoff-status.txt
              printf '%s\n' "$PR_URL" > source-handoff-pr-url.txt
              echo "Existing handoff PR #$PR_NUMBER: $PR_URL"
              exit 0
            fi

            # A previous run may have left this deterministic branch attached to a closed PR.
            # Reuse an already-open PR carrying the exact same Source persistence ref, even if
            # it was regenerated onto a newer Collection base under a different branch name.
            SUPERSEDING_PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json number,url,body --jq --arg source_ref "$SOURCE_REF" '[.[] | select((.body // "") | contains($source_ref))] | .[0] // empty')"
            if [ -n "$SUPERSEDING_PR_JSON" ]; then
              PR_NUMBER="$(printf '%s' "$SUPERSEDING_PR_JSON" | jq -r '.number')"
              PR_URL="$(printf '%s' "$SUPERSEDING_PR_JSON" | jq -r '.url')"
              printf 'handoff_status=PR_EXISTS_SUPERSEDING_BRANCH\nsource_ref=%s\nbranch=%s\npr_number=%s\n' "$SOURCE_REF" "$BRANCH" "$PR_NUMBER" > source-handoff-status.txt
              printf '%s\n' "$PR_URL" > source-handoff-pr-url.txt
              echo "Existing open PR #$PR_NUMBER already carries Source ref $SOURCE_REF: $PR_URL"
              exit 0
            fi

            # Do not delete an audit branch or fail forever on a closed-PR branch.
            # Use a run/attempt-scoped recovery branch when no open PR represents this seal.
            BRANCH="${BRANCH}-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "::warning::Deterministic handoff branch is stale; using recovery branch $BRANCH."
          fi

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/immutable_registry.yaml

          if git diff --cached --quiet; then
            echo "Collection immutable registry already matches the Source seal."
            printf 'handoff_status=NO_STAGED_BINDING_CHANGES\nsource_ref=%s\nbranch=%s\n' "$SOURCE_REF" "$BRANCH" > source-handoff-status.txt
            exit 0
          fi

          git commit -m "chore(source): promote immutable Source durable seal"
          git push --set-upstream origin "$BRANCH"

          EXISTING_PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,url --jq '.[0] // empty')"
          if [ -n "$EXISTING_PR_JSON" ]; then
            PR_NUMBER="$(printf '%s' "$EXISTING_PR_JSON" | jq -r '.number')"
            PR_URL="$(printf '%s' "$EXISTING_PR_JSON" | jq -r '.url')"
            printf 'handoff_status=PR_EXISTS\nsource_ref=%s\nbranch=%s\npr_number=%s\n' "$SOURCE_REF" "$BRANCH" "$PR_NUMBER" > source-handoff-status.txt
            printf '%s\n' "$PR_URL" > source-handoff-pr-url.txt
            echo "Handoff PR already exists for $BRANCH: $PR_URL"
            exit 0
          fi

          set +e
          PR_OUTPUT="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(source): promote immutable Source durable seal" \
            --body "Automated Collection-owned Source handoff. The workflow consumes the Source durable seal, verifies the complete provenance identity at the exact immutable Source persistence commit, and opens a normal Collection PR. Collection Source Gate, Canary, and Production promotion remain authoritative." 2>&1)"
          PR_STATUS=$?
          set -e

          if [ "$PR_STATUS" -ne 0 ]; then
            echo "::warning::Source handoff branch pushed, but automatic PR creation is blocked by the repository GitHub Actions policy."
            printf '%s\n' "$PR_OUTPUT"
            printf 'handoff_status=PR_CREATE_BLOCKED\nsource_ref=%s\nbranch=%s\n' "$SOURCE_REF" "$BRANCH" > source-handoff-status.txt
            printf '%s\n' "$PR_OUTPUT" > source-handoff-error.txt
          else
            printf 'handoff_status=PR_CREATED\nsource_ref=%s\nbranch=%s\n' "$SOURCE_REF" "$BRANCH" > source-handoff-status.txt
            printf '%s\n' "$PR_OUTPUT" > source-handoff-pr-url.txt
          fi

      - name: Ensure handoff evidence status
        if: always()
        run: |
          if [ ! -f source-handoff-status.txt ]; then
            printf 'handoff_status=WORKFLOW_STEP_FAILED\nrun_id=%s\n' "$GITHUB_RUN_ID" > source-handoff-status.txt
          fi

      - name: Upload handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-auto-handoff-${{ github.run_id }}
          path: |
            source-handoff-status.txt
            source-handoff-error.txt
            source-handoff-pr-url.txt
          if-no-files-found: ignore
