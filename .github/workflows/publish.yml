name: Publish Release Candidate

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build Client Rules workflow run ID"
        required: true
        type: string
      build_head_sha:
        description: "Exact commit SHA checked out by the build"
        required: true
        type: string

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout build commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.build_head_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Download immutable build artifact via Actions API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.build_head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          run_id = int(os.environ['RUN_ID'])
          expected_sha = os.environ['EXPECTED_SHA']
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          expected_name = f'release-candidate-{run_id}'
          matches = [a for a in payload.get('artifacts', []) if a.get('name') == expected_name and not a.get('expired') and a.get('workflow_run', {}).get('id') == run_id and a.get('workflow_run', {}).get('head_sha') == expected_sha]
          if len(matches) != 1:
              raise SystemExit(f'exact immutable build artifact not found: name={expected_name} run_id={run_id} head_sha={expected_sha} matches={matches}')
          artifact = matches[0]
          print(json.dumps({'artifact_id': artifact['id'], 'name': artifact['name'], 'archive_download_url': artifact['archive_download_url'], 'digest': artifact.get('digest')}))
          Path = __import__('pathlib').Path
          Path('/tmp/artifact.json').write_text(json.dumps(artifact), encoding='utf-8')
          PY
          ARTIFACT_ID=$(python -c 'import json; print(json.load(open("/tmp/artifact.json"))["id"])')
          ARTIFACT_NAME=$(python -c 'import json; print(json.load(open("/tmp/artifact.json"))["name"])')
          rm -rf release-candidate
          mkdir -p release-candidate
          gh run download "${RUN_ID}" --repo "${REPO}" --name "${ARTIFACT_NAME}" --dir release-candidate
          test "$(cat release-candidate/run-id.txt)" = "${RUN_ID}"
          echo "Downloaded exact immutable artifact ${ARTIFACT_NAME} (id=${ARTIFACT_ID}) from run ${RUN_ID}."
      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Verify Phase 8 final migration gate evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s release-candidate/reports/v1/FINAL_MIGRATION_GATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("release-candidate/reports/v1/FINAL_MIGRATION_GATE.json").read_text(encoding="utf-8"))
          assert obj.get("status") == "PASS", obj
          assert obj.get("current_head",{}).get("expected") == "${{ inputs.build_head_sha }}", obj.get("current_head")
          assert obj.get("phase8",{}).get("sot") == "v1_canonical", obj.get("phase8")
          assert obj.get("deletion_boundary",{}).get("automatic_delete") is False, obj.get("deletion_boundary")
          print("Phase 8 final migration gate evidence: PASS")
          PY

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test -s release-candidate/run-id.txt
          RUN_ID=$(cat release-candidate/run-id.txt)
          test -d "release-candidate/data/runs/${RUN_ID}"
          test -d release-candidate/generated
          test -s "release-candidate/data/baseline/canonical.json"
          test "$(git rev-parse HEAD)" = "${{ inputs.build_head_sha }}"

      - name: Prepare immutable run for Service Gate
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          mkdir -p data/runs
          rm -rf "data/runs/${RUN_ID}"
          cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/

      - name: Batch 01 semantic and overlap audit
        run: python scripts/p0_batch01_semantic_overlap_audit.py

      - name: P0 Service Production Gate
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          # Fail-closed on structural errors (false production claims, missing
          # golden/release, identity drift). Do not require 50/50 production —
          # that is Phase 0 exit, and coverage=partial currently forbids it.
          python scripts/p0_service_production_gate.py --report-only --run-id "${RUN_ID}"

      - name: Publish atomically
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          rm -rf generated data/runs/${RUN_ID}
          mkdir -p data/runs data/baseline
          cp -a release-candidate/generated generated
          cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/
          cp -a release-candidate/data/baseline/canonical.json data/baseline/
          mkdir -p reports/v1
          cp -a release-candidate/reports/v1/*.json reports/v1/
          python scripts/derive_service_production_evidence.py --run-id "${RUN_ID}"
          python scripts/refresh_latest_release_from_promotion.py --run-id "${RUN_ID}"
          python scripts/status_consistency_gate.py
          python scripts/evidence_consistency_gate.py --run-id "${RUN_ID}" || true
          python scripts/partial_production_invariant_gate.py --run-id "${RUN_ID}"
          python scripts/classify_service_artifacts.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated/ data/runs/ data/baseline/ reports/latest_release.json reports/v1/
          if git diff --staged --quiet; then
            echo "No release changes to publish."
            exit 0
          fi
          git commit -m "chore(publish): promote run ${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Published release candidate on attempt ${attempt}."
                exit 0
              fi
              sleep $((attempt * 3))
              continue
            fi
            echo "rebase conflict on attempt ${attempt}; replaying publish tree onto origin/main"
            git rebase --abort || true
            git reset --hard origin/main
            rm -rf "data/runs/${RUN_ID}" generated
            mkdir -p data/runs data/baseline
            cp -a release-candidate/generated generated
            cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/
            cp -a release-candidate/data/baseline/canonical.json data/baseline/
            mkdir -p reports/v1
            cp -a release-candidate/reports/v1/*.json reports/v1/
            python scripts/derive_service_production_evidence.py --run-id "${RUN_ID}"
            python scripts/refresh_latest_release_from_promotion.py --run-id "${RUN_ID}"
            python scripts/status_consistency_gate.py || true
            python scripts/evidence_consistency_gate.py --run-id "${RUN_ID}" || true
            python scripts/partial_production_invariant_gate.py --run-id "${RUN_ID}"
            python scripts/classify_service_artifacts.py || true
            git add -A generated/ data/runs/ data/baseline/ reports/latest_release.json
            if git diff --staged --quiet; then
              echo "No release changes after replay (another job may have published equivalent)."
              exit 0
            fi
            git commit -m "chore(publish): promote run ${RUN_ID}" || true
            sleep $((attempt * 2))
          done
          exit 1
