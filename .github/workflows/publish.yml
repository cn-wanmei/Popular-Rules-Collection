name: Publish Release Candidate

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build Client Rules workflow run ID"
        required: true
        type: string
      build_head_sha:
        description: "Exact commit SHA checked out by the build"
        required: true
        type: string

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      # publish job is mutation path; validation workflows stay contents:read
    steps:
      - name: Checkout build commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.build_head_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Preflight Icon identity match (fail fast)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python scripts/write_ecosystem_release_lock.py \
            --run-id "preflight" \
            --require-icon-identity \
            --out /tmp/ecosystem-release-lock.preflight.json
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "Preflight OK: Icon identity matches *build commit* rule/_index.yaml"
            exit 0
          fi
          # Icon lag is the common daily-automation failure mode. Try cross-repo
          # refresh (needs ICON_DISPATCH_TOKEN), then re-check once.
          TOKEN="${{ secrets.ICON_DISPATCH_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            echo "Icon mismatch — dispatching collection-identity-changed…"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/cn-wanmei/Popular-Rules-Icon/dispatches \
              -d '{"event_type":"collection-identity-changed","client_payload":{"source":"publish-preflight","run_id":"${{ github.run_id }}"}}'
              DISPATCH_RC=$?
              if [ "$DISPATCH_RC" -ne 0 ]; then
                echo "Icon repository_dispatch returned non-zero; will re-check identity without waiting."
              fi
            echo "Dispatched Icon refresh; waiting 90s for auto-merge path…"
            sleep 90
            set +e
            PYTHONPATH=. python scripts/write_ecosystem_release_lock.py \
              --run-id "preflight-retry" \
              --require-icon-identity \
              --out /tmp/ecosystem-release-lock.preflight.json
            RC2=$?
            set -e
            if [ "$RC2" -eq 0 ]; then
              echo "Preflight OK after Icon refresh."
              exit 0
            fi
          else
            echo "::warning::ICON_DISPATCH_TOKEN not set on Collection — cannot auto-refresh Icon from this job."
          fi
          echo "::error::Icon identity still mismatches build commit index. Merge Icon identity snapshot PR (or set ICON_DISPATCH_TOKEN) then re-run Publish."
          exit 1

      - name: Resolve immutable build artifact via Actions API
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.build_head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          run_id = int(os.environ['RUN_ID'])
          expected_sha = os.environ['EXPECTED_SHA']
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          expected_name = f'release-candidate-{run_id}'
          matches = [
              a for a in payload.get('artifacts', [])
              if a.get('name') == expected_name
              and not a.get('expired')
              and a.get('workflow_run', {}).get('id') == run_id
              and a.get('workflow_run', {}).get('head_sha') == expected_sha
          ]
          if len(matches) != 1:
              raise SystemExit(
                  'exact immutable build artifact not found: '
                  f'name={expected_name} run_id={run_id} '
                  f'head_sha={expected_sha} matches={matches}'
              )
          artifact = matches[0]
          print(
              json.dumps(
                  {
                      'artifact_id': artifact['id'],
                      'artifact_name': artifact['name'],
                      'artifact_digest': artifact.get('digest'),
                  }
              )
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"artifact_id={artifact['id']}\n")
              out.write(f"artifact_name={artifact['name']}\n")
              out.write(f"artifact_digest={artifact.get('digest') or ''}\n")
          PY

      - name: Download immutable build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify immutable artifact identity
        shell: bash
        env:
          EXPECTED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_BUILD_SHA: ${{ inputs.build_head_sha }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -s release-candidate/build-run-id.txt
          test -s release-candidate/build-head-sha.txt
          test "$(cat release-candidate/build-run-id.txt)" = "${EXPECTED_BUILD_RUN_ID}"
          test "$(cat release-candidate/build-head-sha.txt)" = "${EXPECTED_BUILD_SHA}"
          ENGINE_RUN_ID="$(cat release-candidate/run-id.txt)"
          test -d "release-candidate/data/runs/${ENGINE_RUN_ID}"
          test -s release-candidate/generated/manifest.json
          test -s release-candidate/data/baseline/canonical.json
          echo "Downloaded exact immutable artifact ${ARTIFACT_NAME} (build_run=${EXPECTED_BUILD_RUN_ID}, head_sha=${EXPECTED_BUILD_SHA}, engine_run=${ENGINE_RUN_ID})."

      - name: Assert artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s release-candidate/run-id.txt
          test -d release-candidate/generated
          test -d release-candidate/rule
          test -s release-candidate/generated/manifest.json
          test -s release-candidate/data/baseline/canonical.json

      - name: Size Gate
        run: python scripts/size_gate.py

      - name: Publish fail-closed policy gate
        run: |
          set -euo pipefail
          # Workflow file under test must be the *running* definition on main,
          # not the historical build commit tree (checkout is build_head_sha).
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/publish.yml > /tmp/publish.main.yml
          git show origin/main:.github/workflows/status.yml > /tmp/status.main.yml
          python scripts/publish_fail_closed_gate.py \
            --workflow /tmp/publish.main.yml \
            --status-workflow /tmp/status.main.yml

      - name: Verify immutable Source lineage
        shell: bash
        run: |
          set -euo pipefail
          if [ -s release-candidate/collection-date.txt ]; then
            DAY="$(cat release-candidate/collection-date.txt)"
            if [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [ -s "backup/${DAY}/manifests/_collection.json" ]; then
              PYTHONPATH=. python scripts/immutable_source_lineage_gate.py \
                --collection-root "backup/${DAY}" \
                --json-out "release-candidate/immutable-source-lineage-publish.json" \
                --allow-missing-current
            else
              echo "collection-date present but backup tree incomplete; lineage gate deferred to source_provenance_gate"
            fi
          else
            echo "No collection-date.txt in artifact; lineage verified by source_provenance_gate on main"
          fi

      - name: Generated distribution gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("release-candidate/generated/manifest.json").read_text(encoding="utf-8"))
          scopes=set(m.get("network_dataset_directories") or [])
          expected={"asn","geoip","geosite","network","provider","policies","ip"}
          missing=sorted(expected-scopes)
          if missing:
              raise SystemExit(f"network distribution incomplete: missing scopes={missing}")
          print(f"generated distribution gate: PASS files={m.get('file_count')} network={sorted(scopes)} mmdb_optional={'mmdb' in scopes}")
          PY

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test -s release-candidate/run-id.txt
          RUN_ID=$(cat release-candidate/run-id.txt)
          test -d "release-candidate/data/runs/${RUN_ID}"
          test -d release-candidate/generated
          test -s "release-candidate/data/baseline/canonical.json"
          test "$(git rev-parse HEAD)" = "${{ inputs.build_head_sha }}"

      - name: Prepare immutable run for Service Gate
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          mkdir -p data/runs
          rm -rf "data/runs/${RUN_ID}"
          cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/

      - name: Batch 01 semantic and overlap audit
        run: python scripts/p0_batch01_semantic_overlap_audit.py

      - name: P0 Service Production Gate
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          python scripts/p0_service_production_gate.py --report-only --run-id "${RUN_ID}"

      - name: Publish atomically
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat release-candidate/run-id.txt)
          rm -rf generated rule data/runs/${RUN_ID}
          mkdir -p data/runs data/baseline
          cp -a release-candidate/rule rule
          cp -a release-candidate/generated generated
          cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/
          cp -a release-candidate/data/baseline/canonical.json data/baseline/
          mkdir -p reports/v1
          cp -a release-candidate/reports/v1/*.json reports/v1/
          PYTHONPATH=. python scripts/derive_service_production_evidence.py --run-id "${RUN_ID}"
          python scripts/refresh_latest_release_from_promotion.py --run-id "${RUN_ID}"
          # Use main read-model for Icon/Source consistency (not build-commit tree)
          git fetch origin main --depth=1
          mkdir -p reports
          git show origin/main:reports/ecosystem_release_status.json > reports/ecosystem_release_status.json
          python scripts/status_consistency_gate.py
          python scripts/evidence_consistency_gate.py \
            --run-id "${RUN_ID}" \
            --require-latest
          python scripts/partial_production_invariant_gate.py --run-id "${RUN_ID}"
          python scripts/classify_service_artifacts.py
          PYTHONPATH=. python scripts/relocate_unmapped_rules.py
          PYTHONPATH=. python scripts/rule_mapping_gate.py --require-empty
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish from the newest main tip on every attempt. The candidate is an
          # immutable artifact and the complete generated tree can be very large;
          # rebasing that full-tree commit can exhaust runner mmap limits.
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            git reset --hard origin/main

            # Preserve release-candidate/ (downloaded immutable input), but reset
            # every published path before re-materializing so retries are idempotent.
            rm -rf generated rule "data/runs/${RUN_ID}" reports/latest_release.json
            mkdir -p data/runs data/baseline
            cp -a release-candidate/rule rule
            cp -a release-candidate/generated generated
            cp -a "release-candidate/data/runs/${RUN_ID}" data/runs/
            cp -a release-candidate/data/baseline/canonical.json data/baseline/
            mkdir -p reports/v1
            cp -a release-candidate/reports/v1/*.json reports/v1/
            PYTHONPATH=. python scripts/derive_service_production_evidence.py --run-id "${RUN_ID}"
            python scripts/refresh_latest_release_from_promotion.py --run-id "${RUN_ID}"

            # Read consistency state from the just-fetched main tip.
            git show origin/main:reports/ecosystem_release_status.json > reports/ecosystem_release_status.json
            python scripts/status_consistency_gate.py
            python scripts/evidence_consistency_gate.py \
              --run-id "${RUN_ID}" \
              --require-latest
            python scripts/partial_production_invariant_gate.py --run-id "${RUN_ID}"
            python scripts/classify_service_artifacts.py
            PYTHONPATH=. python scripts/relocate_unmapped_rules.py
            PYTHONPATH=. python scripts/rule_mapping_gate.py --require-empty

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A rule/ generated/ data/runs/ data/baseline/ reports/latest_release.json reports/v1/
            if git diff --staged --quiet; then
              echo "No release changes to publish."
              exit 0
            fi
            git commit -m "chore(publish): promote run ${RUN_ID}"
            if git push origin HEAD:main; then
              echo "Published release candidate on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::main advanced or push was rejected on attempt ${attempt}; retrying from latest main."
            sleep $((attempt * 3))
          done
          exit 1

      # Docs primary path: workflow_run on success. Explicit dispatch is best-effort
      # without continue-on-error (forbidden by publish_fail_closed_gate).
      - name: Write ecosystem release lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release-candidate/run-id.txt ]; then
            RUN_ID=$(cat release-candidate/run-id.txt)
          else
            RUN_ID=""
          fi
          # Preflight already enforced Icon vs *build commit* index.
          # After promote, rule/_index.yaml may change (artifact + relocate +
          # rebase onto main). Requiring Icon match here is a circular fail:
          # Icon cannot track the new index until after this publish lands.
          # Record lock without --require-icon-identity; refresh Icon next.
          PYTHONPATH=. python scripts/write_ecosystem_release_lock.py \
            --run-id "${RUN_ID}"
          git add -f reports/ecosystem-release-lock.json
          if git diff --cached --quiet; then
            echo "ecosystem-release-lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lock): ecosystem-release-lock for run ${RUN_ID:-unknown}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Refresh Icon identity after promote
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Cross-repo dispatch requires Collection secret ICON_DISPATCH_TOKEN
          # (see docs/ICON_DISPATCH_TOKEN.md). GITHUB_TOKEN cannot trigger Icon.
          TOKEN="${{ secrets.ICON_DISPATCH_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            if curl -fsSL -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/cn-wanmei/Popular-Rules-Icon/dispatches \
              -d '{"event_type":"collection-identity-changed","client_payload":{"source":"publish","run_id":"${{ github.run_id }}"}}'; then
              echo "Icon collection-identity-changed dispatched (ICON_DISPATCH_TOKEN)."
              exit 0
            fi
          fi
          if gh workflow run identity-freshness.yml \
            --repo cn-wanmei/Popular-Rules-Icon \
            --ref main; then
            echo "Icon Identity Freshness dispatched via gh."
          else
            echo "::warning::Could not dispatch Icon Identity Freshness. Set ICON_DISPATCH_TOKEN on Collection or merge Icon identity PR manually before next Publish."
          fi

      - name: Trigger Documentation Layer
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh workflow run docs.yml \
            --repo "${{ github.repository }}" \
            --ref main; then
            echo "Documentation Layer dispatched after publish run ${{ github.run_id }}."
          else
            echo "::warning::Explicit docs dispatch failed; relying on workflow_run if this job concludes success."
          fi
          exit 0
