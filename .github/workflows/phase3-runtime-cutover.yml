name: Phase 3 V1 Runtime Cutover
on:
  pull_request:
    branches: [main]
    paths:
      - "src/engine/sot/resolver.py"
      - "src/engine/runtime/**"
      - "tests/engine/test_phase3_runtime_cutover.py"
      - "docs/PHASE3_V1_RUNTIME_CUTOVER.md"
      - ".github/workflows/phase3-runtime-cutover.yml"
  workflow_dispatch:
jobs:
  phase3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install -r requirements.lock
      - name: Architecture Gate
        run: python scripts/architecture_gate.py
      - name: Phase 3 focused tests
        run: PYTHONPATH=. python -m pytest tests/engine/test_phase3_runtime_cutover.py -q
