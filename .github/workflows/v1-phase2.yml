name: V1 Phase 2.2-2.7 Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "rule/**"
      - "reports/v1/**"
      - "scripts/v1_phase2_audit.py"
      - ".github/workflows/v1-phase2.yml"

jobs:
  v1-phase2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run V1 Phase 2.3-2.7 audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/v1_phase2_audit.py --out reports/v1/phase2
          rc=$?
          echo "audit_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print Phase 2 summary
        run: |
          cat reports/v1/phase2/PHASE2_SUMMARY.md
          echo
          echo "==== PHASE2_GATE.yaml ===="
          cat reports/v1/phase2/PHASE2_GATE.yaml
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: v1-phase2-audit
          path: reports/v1/phase2
          if-no-files-found: error
      - name: Enforce Phase 2 gate
        run: |
          if [ "${{ steps.audit.outputs.audit_rc }}" != "0" ]; then
            echo "V1 Phase 2 gate is BLOCKED. See uploaded audit artifact for findings."
            exit 1
          fi
