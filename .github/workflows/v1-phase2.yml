name: V1 Phase 2.2-2.8 Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "rule/**"
      - "reports/v1/**"
      - "scripts/v1_phase2_audit.py"
      - "scripts/v1_phase2_8_integrity.py"
      - ".github/workflows/v1-phase2.yml"

jobs:
  v1-phase2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run V1 Phase 2.3-2.7 audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/v1_phase2_audit.py --out reports/v1/phase2
          rc=$?
          echo "audit_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Phase 2.8 final integrity / reproducibility gate
        run: |
          python scripts/v1_phase2_8_integrity.py

      - name: Print Phase 2 summary
        run: |
          cat reports/v1/phase2/PHASE2_SUMMARY.md
          echo
          echo "==== PHASE2_GATE.yaml ===="
          cat reports/v1/phase2/PHASE2_GATE.yaml
      - name: Upload audit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-phase2-audit
          path: reports/v1/phase2
          if-no-files-found: error
      - name: Enforce Phase 2 gate
        run: |
          if [ "${{ steps.audit.outputs.audit_rc }}" != "0" ]; then
            echo "V1 Phase 2 gate is BLOCKED. See uploaded audit artifact for findings."
            exit 1
          fi
      # Phase 2 rerun trigger: execute against the latest reconciled PR merge ref.
