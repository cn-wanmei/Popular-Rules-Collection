name: P0 Service Production Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  p0-service-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Batch 01 semantic and overlap audit
        run: python scripts/p0_batch01_semantic_overlap_audit.py
      - name: P0 Service Production Gate (report-only)
        run: python scripts/p0_service_production_gate.py --report-only
