name: Phase O Observation Freeze Retirement
on:
  workflow_dispatch:
    inputs:
      state:
        required: true
        type: choice
        options: [CUTOVER_EXECUTED, OBSERVING, FROZEN_OLD_ROOT, RETIRED]
      enforce:
        description: Enforce the persisted evidence transition
        required: false
        default: true
        type: boolean
jobs:
  phase-o:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install pyyaml
      - run: python -m py_compile scripts/phase_o_r_operational_closure.py scripts/phase_o_observation_retirement.py
      - name: Evidence-bound Phase O gate
        run: python scripts/phase_o_observation_retirement.py --state "${{ inputs.state }}" --json-out reports/v1/PHASE_O_GATE.json
