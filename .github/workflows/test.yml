name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Naming gate
        run: python -m src.engine.cli naming_gate

      - name: Engine unit + contract tests
        run: python -m pytest tests/engine/ -v

      - name: Legacy tests (non-engine)
        run: python -m pytest tests/ --ignore=tests/engine/ -q
        continue-on-error: true
