name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install -r requirements.lock

      - name: Architecture gate
        run: python scripts/architecture_gate.py

      - name: Evidence consistency gate (report)
        run: |
          if [ -f generated/_promotion/latest.json ]; then
            python scripts/evidence_consistency_gate.py || {
              echo "::warning::evidence_consistency_gate reported issues (non-blocking in Unit Tests)"
              exit 0
            }
          else
            echo "No promotion pointer; skipping evidence consistency gate"
          fi

      - name: Partial≠production invariant (hard)
        run: python scripts/partial_production_invariant_gate.py

      - name: Artifact classification (report)
        run: |
          python scripts/classify_service_artifacts.py || {
            echo "::warning::artifact classification skipped or empty"
            exit 0
          }

      - name: Legacy reference gate
        run: python scripts/legacy_reference_gate.py

      - name: Naming gate
        run: python -m src.engine.cli naming_gate

      - name: Engine unit + contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v

      - name: Repository tests
        run: python -m pytest tests/ --ignore=tests/engine/ -q
