name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install -r requirements.lock

      - name: Architecture gate
        run: python scripts/architecture_gate.py

      - name: Naming gate
        run: python -m src.engine.cli naming_gate

      - name: Payment icon semantic regression
        run: python scripts/icon_payment_semantic_test.py

      - name: Engine unit + contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --ignore=tests/engine/unit_legacy_v2_ref

      - name: Legacy tests (non-engine)
        run: python -m pytest tests/ --ignore=tests/engine/ -q
