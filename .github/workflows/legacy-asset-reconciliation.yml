name: Legacy Asset Reconciliation

on:
  push:
    branches: [main, master, phase2.1.2-legacy-asset-reconciliation]
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_*.py"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-reconciliation.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_*.py"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-reconciliation.yml"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Unit tests
        run: python -m pytest tests/engine/test_legacy_asset_reconciliation.py tests/engine/test_legacy_asset_extractor.py -q
      - name: Full index reconciliation
        run: |
          python -m src.engine.ingest.legacy_asset_reconciliation_cli \
            --rule-root rule \
            --jsonl data/legacy_asset_ir.jsonl \
            --report reports/v1/LEGACY_ASSET_RECONCILIATION.yaml \
            --candidates reports/v1/V1_PROMOTION_CANDIDATES.yaml
      - name: Validate reconciliation completeness and promotion block
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from src.engine.ingest.v1_index import load_v1_index

          report = yaml.safe_load(Path("reports/v1/LEGACY_ASSET_RECONCILIATION.yaml").read_text(encoding="utf-8"))
          candidates = yaml.safe_load(Path("reports/v1/V1_PROMOTION_CANDIDATES.yaml").read_text(encoding="utf-8"))
          summary = report["summary"]
          idx = load_v1_index(Path("rule"))
          n_index = idx.entry_count
          intentional_only = {e.id for e in idx.entries if not e.path and not e.is_aggregate}

          assert report["schema"] == "legacy_asset_reconciliation_v1"
          assert summary["indexed_services"] == n_index, summary
          assert summary["metadata_only_services"] == 0, summary
          assert summary["index_only_services"] == len(intentional_only), (
              summary.get("index_only_services"), len(intentional_only), sorted(intentional_only)[:5]
          )
          assert summary["orphan_list_files"] == 0, summary
          assert summary["duplicate_domain_services"] == 0, summary
          assert summary["duplicate_ip_services"] == 0, summary
          assert summary["domain_count_delta_services"] == 0, summary
          assert summary["ip_count_delta_services"] == 0, summary
          assert len({item["id"] for item in report["services"]}) == len(report["services"])
          assert report["promotion"]["blocked"] is True
          assert report["promotion"]["canonical_v1_write"] is False
          assert candidates["schema"] == "v1_promotion_candidates_v1"
          assert candidates["candidate_count"] >= 170
          assert candidates["candidate_count"] <= n_index
          assert candidates["promotion"]["blocked"] is True
          assert candidates["promotion"]["canonical_v1_write"] is False

          for item in report["services"]:
              assert item["id"]
              if item["id"] in intentional_only:
                  # intentional-only: index row without metadata / assets
                  continue
              assert item["metadata_index_status"] == "both-present", item
              assert item["domain"]["status"] == "exact-match", item
              assert item["ip_cidr"]["status"] == "exact-match", item
              assert item["urls"] >= 0

          print(f"{n_index}-service reconciliation completeness: PASS")
          print(f"intentional_only={len(intentional_only)}")
          print(f"V1 promotion candidates: {candidates['candidate_count']}; canonical promotion: BLOCKED")
          PY

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: legacy-asset-reconciliation
          path: |
            reports/v1/LEGACY_ASSET_RECONCILIATION.yaml
            reports/v1/V1_PROMOTION_CANDIDATES.yaml
            data/legacy_asset_ir.jsonl
