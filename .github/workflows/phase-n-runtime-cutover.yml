name: Phase N Runtime Cutover
on:
  workflow_dispatch:
    inputs:
      authorize:
        description: Operator approval flag (actual evidence bundle must be supplied by the cutover run)
        required: true
        default: "false"
        type: choice
        options: ["false","true"]
jobs:
  phase-n-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install pyyaml
      - run: python -m py_compile scripts/phase_n_runtime_cutover.py
      - name: Guard until evidence is actually supplied
        if: inputs.authorize == 'true'
        run: |
          test "$(grep '^status:' config/phase_n_runtime_cutover.yaml | awk '{print $2}')" = "NOT_EXECUTED"
          echo "Phase N authorization was requested, but config is still NOT_EXECUTED; no cutover is performed."
