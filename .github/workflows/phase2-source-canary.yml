name: Phase 2 Source Canary

on:
  pull_request:
    branches: [main]
    paths:
      - "config/source_promotion_policy.yaml"
      - "config/service_primary.yaml"
      - "config/service_primary_extra.yaml"
      - "config/ruleset_hierarchy.yaml"
      - "config/client_capability_matrix.yaml"
      - "scripts/phase2_source_canary.py"
      - "src/engine/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Single service to canary; must be state=canary and enabled=true"
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-canary:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 121
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Resolve and verify Source PR commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          req_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Popular-Rules-Collection-Phase2",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=req_headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          pr = get_json("https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/pulls/2")
          sha = pr["head"]["sha"]

          runs = get_json(
              "https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/actions/runs"
              f"?head_sha={sha}&per_page=100"
          )
          needed = {"CI", "Phase 2 Source Gate"}
          observed = {}
          for run in runs.get("workflow_runs", []):
              name = run.get("name")
              if name in needed:
                  observed[name] = run.get("conclusion")

          missing = sorted(needed - observed.keys())
          bad = sorted(name for name, conclusion in observed.items() if conclusion != "success")
          print(json.dumps(
              {"source_commit": sha, "observed": observed, "missing": missing, "bad": bad},
              ensure_ascii=False,
              indent=2,
          ))
          if missing or bad:
              raise SystemExit(
                  f"Source PR #2 is not green for {sha}; missing={missing}, bad={bad}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")
          PY
      - name: Checkout exact Source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cn-wanmei/Popular-Rules-Source
          ref: ${{ steps.source.outputs.sha }}
          path: .phase2/source
          fetch-depth: 1

      - name: Verify Source exact commit
        run: |
          test "$(git -C .phase2/source rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"

      - name: Resolve activated service set
        id: services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, yaml
          requested = os.environ.get("REQUESTED_SERVICE", "").strip()
          with open("config/source_canary_state.yaml", encoding="utf-8") as fh:
              data = yaml.safe_load(fh) or {}
          services = data.get("services") or {}
          if requested:
              item = services.get(requested) or {}
              if item.get("state") != "canary" or item.get("enabled") is not True:
                  raise SystemExit(f"{requested}: service must be state=canary and enabled=true")
              selected = [requested]
          else:
              selected = sorted(
                  sid for sid, item in services.items()
                  if isinstance(item, dict)
                  and item.get("state") == "canary"
                  and item.get("enabled") is True
              )
          print("selected:", selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("services=" + " ".join(selected) + "\n")
              out.write("count=" + str(len(selected)) + "\n")
          PY
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}

      - name: Run selected Source → V3 canary and rollback rehearsal
        if: steps.services.outputs.count != '0'
        run: |
          PYTHONPATH=. python scripts/phase2_source_canary.py \
            --source-root .phase2/source \
            --source-commit "${{ steps.source.outputs.sha }}" \
            --services ${{ steps.services.outputs.services }} \
            --output reports/phase2-canary

      - name: No active service
        if: steps.services.outputs.count == '0'
        run: |
          mkdir -p reports/phase2-canary
          printf '%s\n' '{"schema":"phase2_canary_summary_v1","all_pass":true,"verified_count":0,"canary_pass_count":0,"production_ready_count":0,"services":{},"failures":{},"note":"No service is activated for Canary."}' \
            > reports/phase2-canary/summary.json

      - name: Upload canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-source-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/phase2-canary
          if-no-files-found: error
          retention-days: 30
