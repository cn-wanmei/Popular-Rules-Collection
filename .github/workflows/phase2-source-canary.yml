name: Phase 2 Source Canary
# Phase 2 contract: bind Canary to an exact Source-main commit and wait for its gates.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase2-source-canary.yml"
      - "config/source_promotion_policy.yaml"
      - "config/service_primary.yaml"
      - "config/service_primary_extra.yaml"
      - "config/ruleset_hierarchy.yaml"
      - "config/client_capability_matrix.yaml"
      - "scripts/phase2_source_canary.py"
      - "scripts/canary_attestation.py"
      - "scripts/phase2_collection_reconciliation.py"
      - "scripts/phase2_observation.py"
      - "scripts/phase2_production_unlock_gate.py"
      - "src/engine/**"
      - "scripts/source_production_gate.py"
      - "scripts/source_canary_gate.py"
      - "config/source_canary_state.yaml"

  workflow_dispatch:
    inputs:
      service:
        description: "Single service to canary; must be state=canary and enabled=true"
        required: false
        type: string
      source_ref:
        description: "Exact Source ref to verify and canary (default: main)"
        required: false
        default: main
        type: string

concurrency:
  group: phase2-Popular-Rules-Collection--github-workflows-phase2-source-canary-yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-canary:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Resolve and verify exact Source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          source_ref = os.environ.get("SOURCE_REF", "").strip() or "main"
          req_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Popular-Rules-Collection-Phase2",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=req_headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          encoded_ref = urllib.parse.quote(source_ref, safe="")
          commit = get_json(
              "https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/commits/"
              + encoded_ref
          )
          sha = commit["sha"]
          needed = {"CI", "Phase 2 Source Gate"}
          observed = {}

          for attempt in range(30):
              runs = get_json(
                  "https://api.github.com/repos/cn-wanmei/Popular-Rules-Source/actions/runs"
                  f"?head_sha={sha}&per_page=100"
              )
              latest = {}
              for run in runs.get("workflow_runs", []):
                  name = run.get("name")
                  if name not in needed:
                      continue
                  previous = latest.get(name)
                  if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                      latest[name] = run
              observed = {name: run.get("conclusion") for name, run in latest.items()}
              statuses = {name: run.get("status") for name, run in latest.items()}
              print(json.dumps(
                  {
                      "attempt": attempt + 1,
                      "source_ref": source_ref,
                      "source_commit": sha,
                      "observed": observed,
                      "statuses": statuses,
                  },
                  ensure_ascii=False,
                  indent=2,
              ))

              missing = sorted(needed - observed.keys())
              terminal_bad = sorted(
                  name for name, conclusion in observed.items()
                  if conclusion not in (None, "success")
              )
              if terminal_bad:
                  raise SystemExit(
                      f"Source ref {source_ref} has failed gate(s) for {sha}: "
                      f"{terminal_bad}; observed={observed}"
                  )
              if not missing and all(observed.get(name) == "success" for name in needed):
                  break
              if attempt == 29:
                  raise SystemExit(
                      f"Timed out waiting for Source ref {source_ref} gates for {sha}; "
                      f"observed={observed}, missing={missing}"
                  )
              time.sleep(20)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")
          PY

      - name: Checkout exact Source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cn-wanmei/Popular-Rules-Source
          ref: ${{ steps.source.outputs.sha }}
          path: .phase2/source
          fetch-depth: 1

      - name: Verify Source exact commit
        run: |
          test "$(git -C .phase2/source rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"

      - name: Install Source runtime dependencies
        run: python -m pip install "jsonschema>=4.21,<5"

      - name: Resolve activated service set
        id: services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, yaml
          requested = os.environ.get("REQUESTED_SERVICE", "").strip()
          with open("config/source_canary_state.yaml", encoding="utf-8") as fh:
              data = yaml.safe_load(fh) or {}
          services = data.get("services") or {}
          if requested:
              item = services.get(requested) or {}
              if item.get("state") != "canary" or item.get("enabled") is not True:
                  raise SystemExit(f"{requested}: service must be state=canary and enabled=true")
              selected = [requested]
          else:
              selected = sorted(
                  sid for sid, item in services.items()
                  if isinstance(item, dict)
                  and item.get("state") == "canary"
                  and item.get("enabled") is True
              )
          print("selected:", selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("services=" + " ".join(selected) + "\n")
              out.write("count=" + str(len(selected)) + "\n")
          PY
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}

      - name: Run selected Source → V3 canary and rollback rehearsal
        id: canary
        if: steps.services.outputs.count != '0'
        run: >-
          PYTHONPATH=. python scripts/phase2_source_canary.py
          --source-root .phase2/source
          --source-commit "${{ steps.source.outputs.sha }}"
          --services ${{ steps.services.outputs.services }}
          --output reports/phase2-canary

      - name: No active service
        if: steps.services.outputs.count == '0'
        run: |
          mkdir -p reports/phase2-canary
          printf '%s\n' '{"schema":"phase2_canary_summary_v1","all_pass":true,"verified_count":0,"canary_pass_count":0,"production_ready_count":0,"services":{},"failures":{},"note":"No service is activated for Canary."}' > reports/phase2-canary/summary.json

      - name: Build non-promoting Canary attestation evidence
        if: always()
        run: python scripts/canary_attestation.py

      - name: Production Unlock qualification (non-mutating)
        if: steps.services.outputs.count == '1' && steps.canary.outcome == 'success'
        run: |
          service="${{ steps.services.outputs.services }}"
          python scripts/phase2_production_unlock_gate.py \
            --service "$service" \
            --canary-report "reports/phase2-canary/$service/report.json" \
            --output "reports/phase2-canary/$service/production-unlock.json"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-source-canary-${{ steps.source.outputs.sha || github.sha }}
          path: reports/phase2-canary
          if-no-files-found: error
          retention-days: 30
