name: Icon V5 Retirement Gate

on:
  push:
    branches:
      - main
    paths:
      - 'config/icon_v6.yaml'
      - 'docs/ICON_V6_CUTOVER.md'
      - '.github/workflows/icon-v5-legacy-cleanup.yml'
  workflow_dispatch:

concurrency:
  group: icon-v5-retirement-gate
  cancel-in-progress: false

jobs:
  retirement-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout: |
            config
            scripts
            .github/workflows
            docs
            README.md
          sparse-checkout-cone-mode: true

      - name: Verify V6 production configuration
        run: |
          set -euo pipefail
          grep -Eq '^provider: v6$' config/icon_v6.yaml
          grep -Eq '^  release_id: icon-2026.09.30.clean1$' config/icon_v6.yaml
          grep -Eq '^  fallback_to_v5: false$' config/icon_v6.yaml
          grep -Eq '^  release_id: icon-2026.09.30.clean1-rb1$' config/icon_v6.yaml

      - name: Verify clean1 and independent rollback manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/manifests/"
          for release in ("icon-2026.09.30.clean1", "icon-2026.09.30.clean1-rb1"):
              with urllib.request.urlopen(base + release + ".json", timeout=30) as r:
                  m = json.loads(r.read().decode("utf-8"))
              assert len(m.get("entries", [])) == 394, release
              assert m.get("coverage_real") == 1.0, release
              assert m.get("coverage_placeholder") == 0.0, release
              ids = [e.get("service_id") for e in m.get("entries", [])]
              assert len(ids) == len(set(ids)) == 394, release
              for e in m["entries"]:
                  variants = e.get("variants") or {}
                  assert len(variants) == 16, (release, e.get("service_id"))
                  for meta in variants.values():
                      assert str(meta.get("path", "")).startswith("/v/")
                      assert str(meta.get("path", "")).endswith(".png")
              print(release, "PASS")
          PY

      - name: Verify physical V5 tree still exists for gated deletion
        run: |
          set -euo pipefail
          git cat-file -e HEAD:assets/icons/v5/README.md
          git cat-file -e HEAD:assets/icons/v5/registry.json
          echo "V5 physical tree exists in the current commit"

      - name: Verify no active V5 runtime references
        run: |
          set -euo pipefail
          if grep -RInE             'assets/icons/v5|fallback_to_v5:[[:space:]]*true|provider:[[:space:]]*v5|icon_resolver_v5|icon_system_v5|Icon System V5.*production'             config scripts .github/workflows             --exclude='icon-v5-legacy-cleanup.yml'; then
            echo "Active production/runtime V5 reference found"
            exit 1
          fi

      - name: Verify clean1 release writer evidence
        run: |
          set -euo pipefail
          grep -Eq 'release-writer build-and-gate: **PASS**|release-writer build-and-gate: PASS' docs/ICON_V6_CUTOVER.md
          grep -Eq 'release-writer publish: **PASS**|release-writer publish: PASS' docs/ICON_V6_CUTOVER.md
          grep -Eq '394/394' docs/ICON_V6_CUTOVER.md
          ! grep -Eq '89|393/394|missing.*ai' docs/ICON_V6_CUTOVER.md

      - name: Verify V5 is not referenced by client resolver configuration
        run: |
          set -euo pipefail
          ! grep -RInE 'assets/icons/v5|fallback_to_v5:[[:space:]]*true|provider:[[:space:]]*v5'             config/icon_v6.yaml scripts/icon_resolver_v6.py             --exclude='icon-v5-legacy-cleanup.yml' 2>/dev/null || {
              echo "Unexpected V5 reference in production resolver/config"
              exit 1
          }

      - name: Retirement gate result
        run: |
          echo "ICON_V5_RETIREMENT_GATE=PASS"
          echo "V5 assets may be physically deleted in the next reviewed commit."
