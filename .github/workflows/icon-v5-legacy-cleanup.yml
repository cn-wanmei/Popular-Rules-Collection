name: Icon V5 Retirement Gate

on:
  push:
    branches:
      - main
    paths:
      - 'config/icon_v6.yaml'
      - 'docs/ICON_V6_CUTOVER.md'
      - '.github/workflows/icon-v5-legacy-cleanup.yml'
      - 'config/icon_v5.yaml'
      - 'config/icon_v5_clients.yaml'
      - 'scripts/icon_resolver_v5.py'
      - 'scripts/icon_system_v5.py'
      - 'scripts/icon_v5_renderers/**'
      - 'tests/test_icon_system_v5.py'
      - '.github/workflows/publish.yml'
      - 'scripts/publish_fail_closed_gate.py'
  workflow_dispatch:

concurrency:
  group: icon-v5-retirement-gate
  cancel-in-progress: false

jobs:
  retirement-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Verify V6 configuration from main
        run: |
          set -euo pipefail
          CFG_URL="https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/config/icon_v6.yaml"
          CFG="$(curl -fsSL "$CFG_URL")"
          grep -Fqx 'provider: v6' <(printf '%s
' "$CFG")
          grep -Fqx '  release_id: icon-2026.09.30.clean1' <(printf '%s
' "$CFG")
          grep -Fqx '  fallback_to_v5: false' <(printf '%s
' "$CFG")
          grep -Fqx '  release_id: icon-2026.09.30.clean1-rb1' <(printf '%s
' "$CFG")

      - name: Verify clean1 and independent rollback manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/manifests/"
          for release in ("icon-2026.09.30.clean1", "icon-2026.09.30.clean1-rb1"):
              with urllib.request.urlopen(base + release + ".json", timeout=30) as r:
                  m = json.loads(r.read().decode("utf-8"))
              entries = m.get("entries", [])
              assert len(entries) == 394, release
              assert m.get("coverage_real") == 1.0, release
              assert m.get("coverage_placeholder") == 0.0, release
              ids = [e.get("service_id") for e in entries]
              assert len(ids) == len(set(ids)) == 394, release
              for e in entries:
                  variants = e.get("variants") or {}
                  assert len(variants) == 16, (release, e.get("service_id"))
                  for meta in variants.values():
                      path = str(meta.get("path", ""))
                      assert path.startswith("/v/"), (release, path)
                      assert path.endswith(".png"), (release, path)
              print(release, "PASS")
          PY

      - name: Verify V5 physical tree exists before deletion
        run: |
          set -euo pipefail
          curl -fsSL             "https://api.github.com/repos/cn-wanmei/Popular-Rules-Collection/contents/assets/icons/v5/README.md?ref=main"             >/dev/null
          curl -fsSL             "https://api.github.com/repos/cn-wanmei/Popular-Rules-Collection/contents/assets/icons/v5/registry.json?ref=main"             >/dev/null
          echo "V5 physical tree exists"

      - name: Verify retired V5 runtime files are absent
        run: |
          set -euo pipefail
          expect_404() {
            local path="$1"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}'               "https://api.github.com/repos/cn-wanmei/Popular-Rules-Collection/contents/$path?ref=main")"
            test "$code" = "404" || { echo "expected 404 for retired V5 path, got $code: $path"; exit 1; }
          }
          expect_404 "config/icon_v5.yaml"
          expect_404 "config/icon_v5_clients.yaml"
          expect_404 "scripts/icon_resolver_v5.py"
          expect_404 "scripts/icon_system_v5.py"
          expect_404 "scripts/icon_v5_renderers/__init__.py"
          expect_404 "scripts/icon_v5_renderers/common.py"
          expect_404 "scripts/icon_v5_renderers/duotone_line.py"
          expect_404 "scripts/icon_v5_renderers/glassmorphism.py"
          expect_404 "scripts/icon_v5_renderers/mbe.py"
          expect_404 "scripts/icon_v5_renderers/minimalist.py"
          expect_404 "scripts/icon_v5_renderers/neo_skeuomorphism.py"
          expect_404 "scripts/icon_v5_renderers/soft_3d.py"
          expect_404 "scripts/icon_v5_renderers/y2k.py"
          expect_404 "tests/test_icon_system_v5.py"
          echo "Retired V5 runtime files: PASS"

      - name: Verify publish path is V6-only
        run: |
          set -euo pipefail
          PUB="$(curl -fsSL "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/.github/workflows/publish.yml")"
          GATE="$(curl -fsSL "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/scripts/publish_fail_closed_gate.py")"
          ! printf '%s
' "$PUB" | grep -E 'assets/icons/v5|icon_system_v5|icon_resolver_v5|icon_registry_v5'
          ! printf '%s
' "$GATE" | grep -E 'assets/icons/v5|icon_system_v5|icon_resolver_v5|icon_registry_v5'
          printf '%s
' "$GATE" | grep -Fq 'config/icon_v6.yaml'
          printf '%s
' "$GATE" | grep -Fq 'fallback_to_v5: false'
          printf '%s
' "$GATE" | grep -Fq 'icon-2026.09.30.clean1'
          echo "V6-only publish path: PASS"

      - name: Verify final cutover evidence
        run: |
          set -euo pipefail
          DOC="$(curl -fsSL "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/docs/ICON_V6_CUTOVER.md")"
          printf '%s
' "$DOC" | grep -Fq 'Canonical services: **394/394**'
          printf '%s
' "$DOC" | grep -Fq 'Production orphan entries: **0**'
          printf '%s
' "$DOC" | grep -Fq 'First clean release-writer build-and-gate: **PASS**'
          printf '%s
' "$DOC" | grep -Fq 'First clean release-writer publish: **PASS**'
          ! printf '%s
' "$DOC" | grep -E '393/394|missing.*ai'
          echo "Cutover evidence: PASS"

      - name: Retirement gate result
        run: |
          echo "ICON_V5_RETIREMENT_GATE=PASS"
          echo "V5 physical assets may now be deleted in the next reviewed commit."
