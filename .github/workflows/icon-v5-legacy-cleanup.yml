name: Icon V5 Retirement Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/icon-v6-clean1-finalize-20260930

jobs:
  retirement-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Check V6 production configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path("config/icon_v6.yaml").read_text(encoding="utf-8"))
          assert cfg.get("provider") == "v6", "V6 is not the selected production provider"
          v6 = cfg.get("v6") or {}
          assert v6.get("release_id"), "V6 release_id is missing"
          print("provider=v6 release_id=", v6["release_id"])
          PY

      - name: Check current V5 safety dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path("config/icon_v6.yaml").read_text(encoding="utf-8"))
          assert (cfg.get("v6") or {}).get("fallback_to_v5") is False,               "V5 fallback is still enabled; retirement is blocked"
          print("V5 fallback disabled")
          PY

      - name: Check active V5 workflow references
        run: |
          set -euo pipefail
          if find .github/workflows -maxdepth 1 -type f ! -name "icon-v5-legacy-cleanup.yml" -print0 | xargs -0 grep -l "icon_system_v5\|assets/icons/v5" -- 2>/dev/null; then
            echo "Active workflow still references V5"
            exit 1
          fi
          echo "No active workflow references V5"

      - name: Check V5 assets are no longer referenced by production config
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='icon-v5-legacy-cleanup.yml'               "assets/icons/v5\|config/icon_v5\|icon_resolver_v5\|icon_system_v5"               config scripts .github 2>/dev/null; then
            echo "Production configuration/code still references V5"
            exit 1
          fi
          echo "No production references to V5"

      - name: Check V6 canonical coverage evidence
        run: |
          set -euo pipefail
          test -f docs/ICON_V6_CUTOVER.md
          grep -Eq "394/394|100%" docs/ICON_V6_CUTOVER.md
          ! grep -Eq "89 .*orphan|missing.*ai|393/394" docs/ICON_V6_CUTOVER.md
          echo "Canonical V6 coverage evidence is clean"

      - name: Check release chain evidence
        run: |
          set -euo pipefail
          test -f docs/PRODUCTION_IDENTITY_AUDIT_2026-09-30.md
          grep -q "reproducible release writer" docs/PRODUCTION_IDENTITY_AUDIT_2026-09-30.md
          echo "Release-chain audit document exists; final release validation remains mandatory"

      - name: Retirement decision
        run: |
          echo "All retirement prerequisites passed. V5 retirement may proceed."
          echo "Deletion must be performed in a reviewed PR after this workflow passes."
