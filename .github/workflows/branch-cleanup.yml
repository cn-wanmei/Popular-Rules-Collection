name: Branch cleanup

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Delete confirmed obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.info('Not a push event; legacy cleanup is skipped.');
              return;
            }
            const message = context.payload.head_commit?.message || '';
            if (!message.startsWith('chore(repo): cleanup legacy branches')) {
              core.info('Not the explicit legacy-cleanup commit; nothing to delete.');
              return;
            }

            const branches = [
              'engine/p0-p1-cutover',
              'engine/p0-p1-cutover-final',
              'engine/p0-p1-cutover-release',
              'engine/p0-p1-cutover-verified',
              'feat/collector-core-stabilization',
              'fix/collector-git-publish',
              'fix/collector-git-publish-dirty-tree',
              'fix/collector-quality-source-error-semantics',
              'fix/production-collection-engine-path',
              'fix/publisher-concurrency-20260902',
              'fix/test-gate-legacy-hard',
              'fix/v3-upstream-acquisition-resilience',
              'v3-collection-dag',
              'v3-collection-p3.6-fix',
              'v3-collection-p3.6',
              'v3-p1-hardening',
              'v3-p1.5-quality-observability',
              'v3-p36-cas-acquisition',
              'v3-p37-incremental-intelligence',
              'v3-p37-incremental-source-intelligence',
              'v3-production-hardening',
              'v3-stabilization-s0-s7',
              'v3-stabilization-s3-dag-resume',
              'v3-stabilization-s4-cas-gc',
              'v3-stabilization-s5-ir-contract'
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted: ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }

  delete-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR head branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const sameRepo = pr.head.repo.full_name === pr.base.repo.full_name;
            if (!sameRepo) {
              core.info(`Skipping fork branch: ${pr.head.repo.full_name}:${branch}`);
              return;
            }
            if (branch === pr.base.ref || branch === 'main') {
              core.info(`Refusing to delete protected/base branch: ${branch}`);
              return;
            }
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            core.info(`Deleted merged PR head branch: ${branch}`);
