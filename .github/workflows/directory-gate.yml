name: Directory Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  directory-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Validate rule directory contract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PYTHONPATH=. python scripts/directory_gate.py --policy-only
            PYTHONPATH=. python scripts/rule_mapping_gate.py
          else
            PYTHONPATH=. python scripts/directory_gate.py
            PYTHONPATH=. python scripts/rule_mapping_gate.py --require-empty
          fi
      - name: Validate current service documentation SSOT
        run: PYTHONPATH=. python scripts/docs_ssot_gate.py
