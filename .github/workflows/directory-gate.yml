name: Directory Gate

on:
  pull_request:
    paths:
      - "rule/**"
      - "generated/**"
      - "scripts/directory_gate.py"
      - "scripts/rule_mapping_gate.py"
      - "scripts/docs_ssot_gate.py"
      - "config/**"
      - "docs/**"
      - ".github/workflows/directory-gate.yml"
  push:
    branches: [main]
    paths:
      - "rule/**"
      - "generated/**"
      - "scripts/directory_gate.py"
      - "scripts/rule_mapping_gate.py"
      - "scripts/docs_ssot_gate.py"
      - "config/**"
      - "docs/**"
      - ".github/workflows/directory-gate.yml"

jobs:
  directory-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Validate rule directory contract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PYTHONPATH=. python scripts/directory_gate.py --policy-only
            PYTHONPATH=. python scripts/rule_mapping_gate.py
          else
            PYTHONPATH=. python scripts/directory_gate.py
            PYTHONPATH=. python scripts/rule_mapping_gate.py
          fi
      - name: Validate current service documentation SSOT
        run: PYTHONPATH=. python scripts/docs_ssot_gate.py
