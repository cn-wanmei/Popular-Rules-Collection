name: Directory Gate

on:
  pull_request:
  push:
    branches: [main, feat/rule-directory-v1]

permissions:
  contents: read

jobs:
  directory-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Validate rule directory contract
        run: python scripts/directory_gate.py
