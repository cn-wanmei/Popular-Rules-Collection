name: Build Client Rules

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and validate but do not publish"
        type: boolean
        default: false
      skip_large:
        description: "Skip configured mega service sets"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Naming gate (HARD)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Engine — one immutable run
        id: engine
        run: |
          set -o pipefail
          ENGINE_ARGS=()
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            ENGINE_ARGS+=(--skip-large)
          fi
          PYTHONPATH=. python -m src.engine.cli all \
            --data data \
            "${ENGINE_ARGS[@]}" 2>&1 | tee engine-run.log
          RUN_ID=$(python3 - <<'PY'
          import json, pathlib
          text = pathlib.Path('engine-run.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('engine output JSON not found')
          obj = json.loads(text[start:])
          if obj.get('status') != 'ok':
              raise SystemExit(f"engine status={obj.get('status')}")
          print(obj['run_id'])
          PY
          )
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Size gate (HARD)
        run: python scripts/size_gate.py

      - name: Publish V3 run (HARD)
        if: ${{ inputs.dry_run != true }}
        run: |
          PYTHONPATH=. python -m src.engine.cli promote \
            --run-id "${{ steps.engine.outputs.run_id }}" \
            --runs data/runs \
            --generated generated \
            --baseline data/baseline/canonical.json

      - name: Commit generated
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ data/baseline/ data/runs/ reports/ || true
          git diff --staged --quiet || git commit -m "chore(engine): rebuild ${GITHUB_SHA::12}"
          git pull --rebase --autostash origin main
          git push
