name: Build Client Rules

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build via registry
        run: python scripts/pipeline.py build
      - run: python scripts/schema_validate.py
      - run: python scripts/validate.py
      - run: python scripts/builder_validate.py
      - run: python scripts/size_gate.py
      - name: Commit generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --staged --quiet || git commit -m "chore(build): regenerate client rules $(date -u +%Y-%m-%d)"
          set +e
          git pull --rebase --autostash origin main
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::rebase failed — refusing to push (no || true swallow)"
            git status || true
            exit 1
          fi
          set -e
          git push
