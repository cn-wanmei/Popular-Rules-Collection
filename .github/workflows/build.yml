name: Build Client Rules

# Optional standalone; full pipeline is "Collect Upstream"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_mihomo.py
      - run: python scripts/build_singbox.py
      - run: python scripts/build_surge.py
      - run: python scripts/build_shadowrocket.py
      - run: python scripts/build_quantumultx.py
      - run: python scripts/build_egern.py
      - name: Commit generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --staged --quiet || git commit -m "chore(build): regenerate client rules $(date -u +%Y-%m-%d)"
          git push
