name: Build Client Rules

on:
  push:
    branches: [main]
    paths:
      - "backup/**"
      - "src/engine/**"
      - "scripts/cross_client_semantic_test.py"
      - "scripts/architecture_gate.py"
      - "config/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only; do not create a publish candidate"
        type: boolean
        default: false
      collection_date:
        description: "Collected backup date (YYYY-MM-DD); empty uses the newest available backup"
        type: string
        required: false
        default: ""
      skip_large:
        description: "Skip configured mega service sets"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Architecture Gate
        run: python scripts/architecture_gate.py

      - name: Naming Gate
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Resolve collected source snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.collection_date }}"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid collection_date: $requested"; exit 1; }
            day="$requested"
          else
            day="$(find backup -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' -printf '%f\n' | sort | tail -1)"
          fi
          [ -n "$day" ] || { echo "No collected backup directories found"; exit 1; }
          source_root="backup/$day"
          [ -d "$source_root/sources" ] || { echo "Missing $source_root/sources"; exit 1; }
          [ -d "$source_root/manifests" ] || { echo "Missing $source_root/manifests"; exit 1; }
          [ -n "$(find "$source_root/sources" -type f -print -quit)" ] || { echo "Collected source root is empty"; exit 1; }
          echo "collection_date=$day" >> "$GITHUB_OUTPUT"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"

      - name: Engine — immutable build
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--sources "${{ steps.source.outputs.source_root }}" --data data)
          if [ "${{ inputs.skip_large }}" = "true" ]; then ARGS+=(--skip-large); fi
          PYTHONPATH=. python -m src.engine.cli all "${ARGS[@]}" > engine-run.json
          python - <<'PY'
          import json
          obj=json.loads(open('engine-run.json',encoding='utf-8').read())
          if obj.get('status') != 'ok': raise SystemExit(f"engine status={obj.get('status')} failures={obj.get('failure_stages')}")
          if obj.get('stages',{}).get('release',{}).get('state') != 'RC_READY': raise SystemExit('engine release is not RC_READY')
          open('engine-run-id.txt','w',encoding='utf-8').write(obj['run_id'])
          PY

      - name: Semantic Test
        run: |
          RUN_ID=$(cat engine-run-id.txt)
          python scripts/cross_client_semantic_test.py \
            --ir "data/runs/${RUN_ID}/ir/ir.json" \
            --generated "data/runs/${RUN_ID}/artifacts"

      - name: Unit and contract tests
        run: PYTHONPATH=. python -m pytest tests/engine/ -v --ignore=tests/engine/unit_legacy_v2_ref

      - name: Stage publish candidate
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(cat engine-run-id.txt)
          PYTHONPATH=. python -m src.engine.cli promote \
            --run-id "$RUN_ID" \
            --runs data/runs \
            --generated release-candidate/generated \
            --baseline release-candidate/data/baseline/canonical.json
          mkdir -p release-candidate/data/runs
          cp -a "data/runs/${RUN_ID}" release-candidate/data/runs/
          cp -a "data/baseline" release-candidate/data/ 2>/dev/null || true
          printf '%s\n' "$RUN_ID" > release-candidate/run-id.txt
          cp config/client_capability_matrix.yaml release-candidate/

      - name: Upload immutable build artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
