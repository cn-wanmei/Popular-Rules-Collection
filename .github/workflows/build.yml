name: Build Client Rules

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and validate but do not publish"
        type: boolean
        default: false
      skip_large:
        description: "Skip configured mega service sets"
        type: boolean
        default: false
      collection_date:
        description: "Collected backup date (YYYY-MM-DD); empty uses the newest available backup"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach checkout to main
        run: |
          git fetch --prune origin main
          git switch -C main origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Naming gate (HARD)
        run: PYTHONPATH=. python -m src.engine.cli naming_gate

      - name: Resolve collected source snapshot (HARD)
        id: source
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.collection_date }}"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo "Invalid collection_date: $requested (expected YYYY-MM-DD)"
              exit 1
            }
            day="$requested"
          else
            day="$(find backup -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' -printf '%f\n' | sort | tail -1)"
          fi

          [ -n "$day" ] || {
            echo "No collected backup directories found under backup/"
            exit 1
          }

          source_root="backup/$day"
          [ -d "$source_root/sources" ] || {
            echo "Collected source root missing: $source_root/sources"
            exit 1
          }
          [ -d "$source_root/manifests" ] || {
            echo "Collected manifests missing: $source_root/manifests"
            exit 1
          }
          [ -n "$(find "$source_root/sources" -type f -print -quit)" ] || {
            echo "Collected source root is empty: $source_root/sources"
            exit 1
          }
          [ -n "$(find "$source_root/manifests" -type f -name '*.json' -print -quit)" ] || {
            echo "No collection manifests found: $source_root/manifests"
            exit 1
          }

          echo "Using collected source snapshot: $source_root"
          echo "collection_date=$day" >> "$GITHUB_OUTPUT"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"

      - name: Engine — one immutable run
        id: engine
        shell: bash
        run: |
          set -o pipefail
          ENGINE_ARGS=()
          if [ "${{ inputs.skip_large }}" = "true" ]; then
            ENGINE_ARGS+=(--skip-large)
          fi
          PYTHONPATH=. python -m src.engine.cli all \
            --sources "${{ steps.source.outputs.source_root }}" \
            --data data \
            "${ENGINE_ARGS[@]}" 2>&1 | tee engine-run.log
          RUN_ID=$(python3 - <<'PY'
          import json, pathlib
          text = pathlib.Path('engine-run.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('engine output JSON not found')
          obj = json.loads(text[start:])
          if obj.get('status') != 'ok':
              raise SystemExit(f"engine status={obj.get('status')} failures={obj.get('failure_stages')}")
          if not obj.get('run_id'):
              raise SystemExit('engine run_id missing')
          print(obj['run_id'])
          PY
          )
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Size gate (HARD)
        run: python scripts/size_gate.py

      - name: Publish V3 run (HARD)
        if: ${{ inputs.dry_run != true }}
        run: |
          PYTHONPATH=. python -m src.engine.cli promote \
            --run-id "${{ steps.engine.outputs.run_id }}" \
            --runs data/runs \
            --generated generated \
            --baseline data/baseline/canonical.json

      - name: Commit generated
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # engine-run.log is transient and intentionally untracked.
          # Remove it before staging so the post-commit workspace check is deterministic.
          rm -f engine-run.log

          git add -A generated/ data/baseline/ data/runs/ reports/

          if git diff --staged --quiet; then
            echo "No build changes; nothing to push."
            exit 0
          fi

          echo "Staged build changes:"
          git diff --cached --stat
          git commit -m "chore(engine): rebuild ${{ steps.source.outputs.collection_date }}"

          # Never rebase with a dirty workspace.
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "Build workspace is dirty after commit; refusing rebase/push."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            if ! git rebase --autostash origin/main; then
              echo "Rebase failed because main contains a conflicting change. Aborting safely."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published build on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "Push race detected; refetching and retrying (attempt ${attempt}/5)."
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to publish build after 5 attempts."
          exit 1
