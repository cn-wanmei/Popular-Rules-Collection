name: Legacy Asset Extractor

on:
  push:
    branches:
      - phase2.1.1-legacy-asset-extractor
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_extractor.py"
      - "Makefile"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-extractor.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_extractor.py"
      - "Makefile"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-extractor.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Unit tests — extractor
        run: PYTHONPATH=. python -m pytest tests/engine/test_legacy_asset_extractor.py -q

      - name: Extract service-level Legacy Asset IR
        run: PYTHONPATH=. python -m src.engine.ingest.legacy_asset_cli --rule-root rule --manifest data/legacy_asset_ir.yaml

      - name: Validate expected inventory coverage
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import yaml
          report = yaml.safe_load(Path("data/legacy_asset_ir.yaml").read_text(encoding="utf-8"))
          summary = report["summary"]
          assert summary["services"] == 184, summary
          assert summary["records"] > 0, summary
          assert report["relation_drift"], "expected known aggregate relation drift"
          print(summary)
          print("relation_drift=", len(report["relation_drift"]))
          PY

      - name: Upload Legacy Asset IR manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: legacy-asset-ir-${{ github.sha }}
          path: data/legacy_asset_ir.yaml
          if-no-files-found: error
          retention-days: 7
