name: Legacy Asset Extractor

on:
  push:
    branches:
      - main
      - master
      - phase2.1.1-legacy-asset-extractor
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_extractor.py"
      - "Makefile"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-extractor.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rule/**"
      - "src/engine/ingest/**"
      - "tests/engine/test_legacy_asset_extractor.py"
      - "Makefile"
      - "requirements.lock"
      - ".github/workflows/legacy-asset-extractor.yml"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Unit tests — extractor
        run: PYTHONPATH=. python -m pytest tests/engine/test_legacy_asset_extractor.py -q

      - name: Extract service-level Legacy Asset IR and full asset stream
        run: |
          PYTHONPATH=. python -m src.engine.ingest.legacy_asset_cli \
            --rule-root rule \
            --manifest data/legacy_asset_ir.yaml \
            --jsonl data/legacy_asset_ir.jsonl

      - name: Validate 184-service completeness, provenance, reconciliation and URL inventory
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          report = yaml.safe_load(Path("data/legacy_asset_ir.yaml").read_text(encoding="utf-8"))
          summary = report["summary"]
          services = report["services"]
          assert report["schema"] == "legacy_asset_ir_v1", report.get("schema")
          assert summary["services"] == 184, summary
          assert len(services) == 184, len(services)
          assert len({service["id"] for service in services}) == 184, "duplicate service ids"
          assert "relation_drift" in report
          assert "profile" in report
          assert len(report["profile"].get("services", {})) == 184

          index_ids = {service["id"] for service in services if service.get("index_present")}
          assert len(index_ids) == 184, f"indexed services={len(index_ids)}"
          assert not [service for service in services if not service.get("metadata_present")]
          errors = [
              (service["id"], error)
              for service in services
              for error in service.get("errors", [])
          ]
          assert not errors, errors[:20]

          expected_files = {
              str(path.as_posix())
              for category in Path("rule").iterdir()
              if category.is_dir()
              for path in category.iterdir()
              if path.is_file() and path.name.lower().endswith(".list")
          }
          profiled_files = {item["path"] for item in report["profile"].get("files", [])}
          assert profiled_files == expected_files, {
              "missing_profile": sorted(expected_files - profiled_files)[:20],
              "unexpected_profile": sorted(profiled_files - expected_files)[:20],
          }
          assert all(item["records"] >= 0 for item in report["profile"]["files"])

          jsonl_path = Path("data/legacy_asset_ir.jsonl")
          assert jsonl_path.exists(), "missing full asset JSONL"
          identities = set()
          jsonl_records = 0
          url_counts = {}
          with jsonl_path.open(encoding="utf-8") as handle:
              for raw in handle:
                  item = json.loads(raw)
                  jsonl_records += 1
                  service = item["service"]
                  asset = item["asset"]
                  provenance = item["provenance"]
                  identity = (service, asset["type"], asset["value"])
                  assert identity not in identities, f"duplicate asset identity: {identity}"
                  identities.add(identity)
                  assert provenance["path"]
                  assert provenance["generated_file"]
                  assert int(provenance["line"]) > 0, provenance
                  assert provenance["detected_format"]
                  assert item["occurrences"] >= 1
                  assert item["evidence"]
                  for evidence in item["evidence"]:
                      assert evidence["path"]
                      assert evidence["generated_file"]
                      assert int(evidence["line"]) > 0
                      assert evidence["detected_format"]
                  if asset["type"] == "url":
                      url_counts[service] = url_counts.get(service, 0) + 1

          assert jsonl_records == summary["records"], (jsonl_records, summary["records"])
          assert report["profile"]["jsonl"]["records"] == jsonl_records
          assert report["profile"]["jsonl"]["sha256"]

          for service in services:
              sid = service["id"]
              assert sid in report["profile"]["services"]
              assert "reconciliation" in service
              assert service["reconciliation"]["status"] == "reconcile-later"
              assert service["assets"]["urls"] == url_counts.get(sid, 0)
              assert isinstance(service.get("source_files", []), list)

          print(summary)
          print("relation_drift=", len(report["relation_drift"]))
          print("profiled_files=", len(profiled_files))
          print("jsonl_records=", jsonl_records)
          print("profile_seconds=", report["profile"]["totals"].get("total_seconds"))
          PY

      - name: Upload Legacy Asset IR manifest and full asset stream
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: legacy-asset-ir-${{ github.sha }}
          path: |
            data/legacy_asset_ir.yaml
            data/legacy_asset_ir.jsonl
          if-no-files-found: error
          retention-days: 7
