name: Legacy Asset Extractor

on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Unit tests — extractor
        run: PYTHONPATH=. python -m pytest tests/engine/test_legacy_asset_extractor.py -q

      - name: Extract service-level Legacy Asset IR and full asset stream
        run: |
          PYTHONPATH=. python -m src.engine.ingest.legacy_asset_cli \
            --rule-root rule \
            --manifest data/legacy_asset_ir.yaml \
            --jsonl data/legacy_asset_ir.jsonl

      - name: Validate service completeness, provenance, reconciliation and URL inventory
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          from src.engine.ingest.v1_index import load_v1_index

          report = yaml.safe_load(Path("data/legacy_asset_ir.yaml").read_text(encoding="utf-8"))
          summary = report["summary"]
          services = report["services"]
          idx = load_v1_index(Path("rule"))
          intentional_only = {e.id for e in idx.entries if not e.path and not e.is_aggregate}

          assert report["schema"] == "legacy_asset_ir_v1", report.get("schema")
          assert summary["services"] >= 170, summary
          assert len(services) == summary["services"], (len(services), summary["services"])
          assert len({s["id"] for s in services}) == len(services), "duplicate service ids"
          assert "relation_drift" in report
          assert "profile" in report
          assert len(report["profile"].get("services", {})) >= 170

          index_ids = {s["id"] for s in services if s.get("index_present")}
          assert len(index_ids) >= 170, f"indexed services={len(index_ids)}"

          missing_meta = [
              s for s in services
              if s.get("index_present")
              and s["id"] not in intentional_only
              and not s.get("metadata_present")
          ]
          assert not missing_meta, missing_meta[:20]

          errors = [
              (s["id"], err)
              for s in services
              if s["id"] not in intentional_only
              for err in s.get("errors", [])
          ]
          assert not errors, errors[:20]

          expected_files = {
              path.as_posix()
              for path in Path("rule").rglob("*.list")
              if path.is_file()
          }
          profiled_files = {item["path"] for item in report["profile"].get("files", [])}
          assert profiled_files == expected_files, {
              "missing_profile": sorted(expected_files - profiled_files)[:20],
              "unexpected_profile": sorted(profiled_files - expected_files)[:20],
          }
          assert all(item["records"] >= 0 for item in report["profile"]["files"])

          jsonl_path = Path("data/legacy_asset_ir.jsonl")
          assert jsonl_path.exists(), "missing full asset JSONL"
          identities = set()
          jsonl_records = 0
          url_counts = {}
          with jsonl_path.open(encoding="utf-8") as handle:
              for raw in handle:
                  item = json.loads(raw)
                  jsonl_records += 1
                  service = item["service"]
                  asset = item["asset"]
                  provenance = item["provenance"]
                  identity = (service, asset["type"], asset["value"])
                  assert identity not in identities, f"duplicate asset identity: {identity}"
                  identities.add(identity)
                  assert provenance["path"]
                  assert provenance["generated_file"]
                  assert int(provenance["line"]) > 0, provenance
                  assert provenance["detected_format"]
                  assert item["occurrences"] >= 1
                  assert item["evidence"]
                  for evidence in item["evidence"]:
                      assert evidence["path"]
                      assert evidence["generated_file"]
                      assert int(evidence["line"]) > 0
                      assert evidence["detected_format"]
                  if asset["type"] == "url":
                      url_counts[service] = url_counts.get(service, 0) + 1

          assert jsonl_records == summary["records"], (jsonl_records, summary["records"])
          assert report["profile"]["jsonl"]["records"] == jsonl_records
          # sha256 may be optional depending on extractor version
          assert report["profile"]["jsonl"].get("sha256") is not None

          for service in services:
              sid = service["id"]
              if sid in intentional_only:
                  continue
              assert sid in report["profile"]["services"], sid
              assert "reconciliation" in service, sid
              assert service["reconciliation"]["status"] == "reconcile-later", service.get("reconciliation")
              assert service["assets"]["urls"] == url_counts.get(sid, 0), (sid, service["assets"], url_counts.get(sid))
              assert isinstance(service.get("source_files", []), list)

          print(summary)
          print("intentional_only", len(intentional_only))
          print("relation_drift=", len(report["relation_drift"]))
          print("url_services=", len(url_counts))
          print("extractor_seconds=", report.get("timing", {}).get("total_seconds"))
          PY

      - name: Upload Legacy Asset IR manifest and full asset stream
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: legacy-asset-ir-${{ github.sha }}
          path: |
            data/legacy_asset_ir.yaml
            data/legacy_asset_ir.jsonl
          if-no-files-found: error
          retention-days: 7
