# GeoIP — country/region (≠ Service IP ownership)
version: 1
updated: "2026-08-28"
kind: geoip
datasets:
  - id: geoip-cn
    name: Country CN CIDRs
    enabled: true
    scope: country
    path: database/geoip/cn.txt
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: text/cn.txt
    notes: Country dataset under database/geoip — not database/ips service sidecars.

  - id: geoip-jp
    name: Country JP CIDRs
    enabled: true
    scope: country
    path: database/geoip/jp.txt
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: text/jp.txt

  - id: geoip-hk
    name: Country HK CIDRs
    enabled: true
    scope: country
    path: database/geoip/hk.txt
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: text/hk.txt

  - id: geoip-sg
    name: Country SG CIDRs
    enabled: true
    scope: country
    path: database/geoip/sg.txt
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: text/sg.txt

  - id: geoip-kr
    name: Country KR CIDRs
    enabled: true
    scope: country
    path: database/geoip/kr.txt
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: text/kr.txt

  - id: geoip-mmdb
    name: Loyalsoldier Country.mmdb artifact
    enabled: true
    scope: artifact
    artifact: generated/mmdb/Country.mmdb
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: geoip
      branch: release
    remote_path: Country.mmdb
    notes: MMDB stays binary artifact — never explode into database/ips/.
