    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: v2ray-rules-dat
      branch: release
    remote_path: direct-list.txt
    notes: Dataset category for DIRECT routing; not a Service id.

  - id: geosite-proxy
    name: Loyalsoldier proxy-list
    enabled: true
    scope: geosite
    maps_category: proxy
    path: database/geosite/proxy.txt
    policy_hint: proxy
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: v2ray-rules-dat
      branch: release
    remote_path: proxy-list.txt
    notes: Dataset category for PROXY routing; not a Service id.
