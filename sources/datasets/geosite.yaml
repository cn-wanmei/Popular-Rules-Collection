# Geosite — domain classification (≠ Service Identity)
version: 1
updated: "2026-08-28"
kind: geosite
datasets:
  - id: geosite-direct
    name: Loyalsoldier direct-list (CN-oriented)
    enabled: true
    scope: geosite
    maps_category: direct
    path: database/geosite/direct.txt
