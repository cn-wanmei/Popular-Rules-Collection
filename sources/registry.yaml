# Registry V3 — Source + Fetcher + Collection Manifest
# Add a service: append under sources[].rules (path + name)
# name = canonical service id; local = optional backup filename

version: 3
last_updated: "2026-08-25"

sources:
  - id: blackmatrix7
    name: BlackMatrix7 ios_rule_script
    url: https://github.com/blackmatrix7/ios_rule_script
    enabled: true
    priority: 95
    trust: high
    score_hint: 95
    formats: [clash, surge, quantumultx, shadowrocket, loon]
    notes: Largest curated multi-client rule set. High coverage.
    fetch:
      type: github_raw
      owner: blackmatrix7
      repo: ios_rule_script
      branch: master
    rules:
      - { path: rule/Clash/Apple/Apple.yaml, name: apple, local: Clash_Apple.yaml }
      - { path: rule/Clash/Google/Google.yaml, name: google, local: Clash_Google.yaml }
      - { path: rule/Clash/Telegram/Telegram.yaml, name: telegram, local: Clash_Telegram.yaml }
      - { path: rule/Clash/Netflix/Netflix.yaml, name: netflix, local: Clash_Netflix.yaml }
      - { path: rule/Clash/GitHub/GitHub.yaml, name: github, local: Clash_GitHub.yaml }
      - { path: rule/Clash/Microsoft/Microsoft.yaml, name: microsoft, local: Clash_Microsoft.yaml }
      - { path: rule/Clash/Discord/Discord.yaml, name: discord, local: Clash_Discord.yaml }
      - { path: rule/Clash/OpenAI/OpenAI.yaml, name: openai, local: Clash_OpenAI.yaml }
      - { path: rule/Clash/YouTube/YouTube.yaml, name: youtube, local: Clash_YouTube.yaml }
      - { path: rule/Clash/BiliBili/BiliBili.yaml, name: bilibili, local: Clash_BiliBili.yaml }
      - { path: rule/Clash/Steam/Steam.yaml, name: steam, local: Clash_Steam.yaml }
      - { path: rule/Clash/TikTok/TikTok.yaml, name: tiktok, local: Clash_TikTok.yaml }
      - { path: rule/Clash/Twitter/Twitter.yaml, name: twitter, local: Clash_Twitter.yaml }
      - { path: rule/Clash/Disney/Disney.yaml, name: disney, local: Clash_Disney.yaml }
      - { path: rule/Clash/China/China.yaml, name: china, local: Clash_China.yaml }
      - { path: rule/Surge/Apple/Apple.list, name: apple, local: Surge_Apple.list }
      - { path: rule/Surge/Google/Google.list, name: google, local: Surge_Google.list }

  - id: loyalsoldier
    name: Loyalsoldier clash-rules / v2ray-rules-dat
    url: https://github.com/Loyalsoldier/clash-rules
    enabled: true
    priority: 98
    trust: high
    score_hint: 98
    formats: [clash, geosite, geoip]
    related: [https://github.com/Loyalsoldier/v2ray-rules-dat]
    notes: Excellent China / GFW / geosite quality. Preferred for geo data.
    fetch:
      type: github_raw
      owner: Loyalsoldier
      repo: clash-rules
      branch: release
    rules:
      - { path: reject.txt, name: adblock, local: reject.txt }
      - { path: icloud.txt, name: apple, local: icloud.txt }
      - { path: apple.txt, name: apple, local: apple.txt }
      - { path: google.txt, name: google, local: google.txt }
      - { path: proxy.txt, name: proxy, local: proxy.txt }
      - { path: direct.txt, name: china, local: direct.txt }
      - { path: private.txt, name: private, local: private.txt }
      - { path: gfw.txt, name: gfw, local: gfw.txt }
      - { path: greatfire.txt, name: gfw, local: greatfire.txt }
      - { path: tld-not-cn.txt, name: proxy, local: tld-not-cn.txt }
      - { path: telegramcidr.txt, name: telegram, local: telegramcidr.txt }
      - { path: cncidr.txt, name: china, local: cncidr.txt }
      - { path: lancidr.txt, name: private, local: lancidr.txt }
      - { path: applications.txt, name: applications, local: applications.txt }

  - id: anti-ad
    name: anti-AD
    url: https://github.com/privacy-protection-tools/anti-AD
    enabled: true
    priority: 90
    trust: high
    score_hint: 92
    formats: [hosts, dnsmasq, surge, clash]
    notes: Strong ad/privacy domain list. Prefer for AdBlock domain layer.
    fetch:
      type: github_raw
      owner: privacy-protection-tools
      repo: anti-AD
      branch: master
    rules:
      - { path: anti-ad-domains.txt, name: adblock, local: anti-ad-domains.txt }
      - { path: anti-ad-surge.txt, name: adblock, local: anti-ad-surge.txt }
      - { path: anti-ad-clash.yaml, name: adblock, local: anti-ad-clash.yaml }

  - id: hagezi
    name: hagezi DNS Blocklists
    url: https://github.com/hagezi/dns-blocklists
    enabled: true
    priority: 93
    trust: high
    score_hint: 97
    formats: [hosts, adblock, domains]
    notes: Collects Light + Pro + Ultimate into adblock service (union). Profiles later.
    fetch:
      type: github_raw
      owner: hagezi
      repo: dns-blocklists
      branch: main
    rules:
      - { path: adblock/ultimate.txt, name: adblock, local: adblock-ultimate.txt }
      - { path: adblock/pro.txt, name: adblock, local: adblock-pro.txt }
      - { path: adblock/light.txt, name: adblock, local: adblock-light.txt }

  - id: sukkaw
    name: SukkaW Surge Ruleset
    url: https://github.com/SukkaW/Surge
    enabled: true
    priority: 88
    trust: high
    score_hint: 90
    formats: [surge, clash, sing-box]
    notes: Rules served from ruleset.skk.moe CDN (not GitHub raw).
    fetch:
      type: cdn
      bases:
        - https://ruleset.skk.moe
        - https://ruleset-mirror.skk.moe
    rules:
      - { path: List/non_ip/apple_services.conf, name: apple, local: non_ip_apple_services.conf }
      - { path: List/non_ip/microsoft.conf, name: microsoft, local: non_ip_microsoft.conf }
      - { path: List/non_ip/ai.conf, name: openai, local: non_ip_ai.conf }
      - { path: List/non_ip/global.conf, name: proxy, local: non_ip_global.conf }
      - { path: List/non_ip/reject.conf, name: adblock, local: non_ip_reject.conf }
      - { path: List/ip/telegram.conf, name: telegram, local: ip_telegram.conf }
      - { path: List/ip/china_ip.conf, name: china, local: ip_china.conf }
      - { path: List/domainset/reject.conf, name: adblock, local: domainset_reject.conf }
